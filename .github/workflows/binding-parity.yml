name: binding parity

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    name: Python/JS binding surface guards
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./crates/jsbos
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Setup yarn
        run: corepack enable && corepack prepare yarn@4.13.0 --activate

      - name: Install dependencies
        run: yarn install --no-immutable

      # All three guards read the binding sources and the API reference
      # statically, so they need no Rust toolchain and no native addon. Running
      # them on every pull request keeps the Python and JavaScript surfaces from
      # drifting before merge; the heavier jsbos pipeline only runs on pushes to
      # main.
      - name: Run the static binding guards
        run: npx ava test/parity.test.js test/native-bindings.test.js test/api-docs.test.js
