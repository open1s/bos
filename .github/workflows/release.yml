name: release

# Build and publish the BSH installation packages for macOS, Linux and Windows.
#
# A `vX.Y.Z` tag is the release trigger and the version source of truth: the
# workspace Cargo.toml must already carry the same number (the prepare job
# fails otherwise, so an artifact can never disagree with its tag). A manual
# dispatch builds the same artifacts without publishing unless "publish" is
# set; that is the dry-run path for validating a packaging change.
#
# Signing is optional and secret-driven: without the Apple/Windows secrets the
# job still produces working artifacts, but macOS apps are only ad-hoc signed
# and Windows binaries are unsigned. See docs/bsh-release.md.

on:
  # Tags only: a main push must not start a release build (prepare rejects a
  # branch as a version and the run would fail noisily on every commit).
  push:
    tags:
      - "v[0-9]*"
  workflow_dispatch:
    inputs:
      version:
        description: "Expected version (must match Cargo.toml); empty reads the manifest"
        required: false
        type: string
      publish:
        description: "Create or update the GitHub release"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # The dmg's LSMinimumSystemVersion; keep in step with installer metadata.
  MACOSX_DEPLOYMENT_TARGET: "11.0"

jobs:
  prepare:
    name: Resolve the release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.gate.outputs.version }}
      should_release: ${{ steps.gate.outputs.should_release }}
      publish: ${{ steps.version.outputs.publish }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v6

      # Release only when a vX.Y.Z tag matches every manifest. Otherwise the
      # run is skipped with a warning - no artifacts, no failure - instead of
      # building a set that cannot agree with the tag.
      - name: Check the release precondition
        id: gate
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: bash scripts/ci/release-precondition.sh

      - name: Resolve and validate the version
        id: version
        if: steps.gate.outputs.should_release == 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: bash scripts/ci/resolve-release-version.sh

      # The same tag also releases npm and PyPI, so all three manifests must
      # carry the version the tag names.
      - name: Check the manifests agree with the tag
        if: steps.gate.outputs.should_release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: bash scripts/ci/check-release-versions.sh "$VERSION"

  verify:
    name: Test the tagged tree
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v6

      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - name: Setup Rust 1.98.1
        uses: dtolnay/rust-toolchain@1.98.1

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: release-verify
          cache-on-failure: true
          workspaces: ". -> target"

      - name: Setup Zig 0.16
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev libsoup-3.0-dev libgdk-pixbuf-2.0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-xcb-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libfontconfig1-dev libfreetype6-dev libssl-dev libasound2-dev libxdo-dev \
            libc++-dev libc++abi-dev libxml2-dev xvfb bubblewrap

      # The same gate the main branch runs. A release is a tagged commit, so
      # the tagged tree must pass the suite before any artifact is published;
      # the browser engine tests are skipped for the same load-flakiness
      # reason rust.yml skips them. One retry covers the Ghostty native fetch
      # resetting; a real test failure still fails on the second attempt.
      - name: Test
        shell: bash
        # One test thread: GPUI's test scheduler is thread-local and asserts
        # when activity from another thread reaches the running test. Under
        # parallel execution a background task from one shell test lands on
        # the next test's scheduler and fails the run with "your test is not
        # deterministic" even though every assertion passed. Serial execution
        # is slower but reproducible, which is what a publish gate needs.
        run: |
          for attempt in 1 2; do
            if xvfb-run -a cargo test --workspace --exclude jsbos --exclude nbos -- --test-threads=1 --skip browser::engine::tests; then
              exit 0
            fi
            if [ "$attempt" -eq 2 ]; then exit 1; fi
            echo "::warning::test attempt $attempt failed; retrying in 30s"
            sleep 30
          done

  build:
    name: Package ${{ matrix.platform }}
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    # GitHub's free arm64 runners are periodically preempted mid-build (three
    # observed shutdowns at 21-28 minutes). Keep attempting arm64, publish it
    # when it survives, and never let that infrastructure failure block the
    # x86_64, macOS and Windows release.
    continue-on-error: ${{ matrix.platform == 'linux-arm64' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            os: macos-15
            target: aarch64-apple-darwin
          - platform: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: linux-arm64
            # 24.04 is the first arm64 image GitHub hosts; its glibc floor is
            # 2.39, so this package targets newer distros than the x86_64 one.
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - platform: windows-x64
            os: windows-2022
            target: x86_64-pc-windows-msvc
            winarch: x64
          - platform: windows-arm64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            winarch: arm64
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      WINDOWS_CERTIFICATE_PFX: ${{ secrets.WINDOWS_CERTIFICATE_PFX }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v6

      # The runner images keep ~14 GB free; a release build of this workspace
      # (Ghostty's native archive plus an LTO link) needs the room. These are
      # toolchains this build never touches.
      - name: Reclaim runner disk
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - name: Setup Rust 1.98.1
        uses: dtolnay/rust-toolchain@1.98.1

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.platform }}
          cache-on-failure: true
          workspaces: ". -> target"

      - name: Setup Zig 0.16
        if: runner.os != 'Windows'
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev libsoup-3.0-dev libgdk-pixbuf-2.0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-xcb-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libfontconfig1-dev libfreetype6-dev libssl-dev libasound2-dev libxdo-dev \
            libc++-dev libc++abi-dev libxml2-dev rpm

      # Zig 0.16's libc++ headers need LLVM 21 symbols that jammy/noble's
      # default libc++ (14/18) does not export. Install LLVM 21's static
      # archives so the release binary carries the runtime instead of
      # depending on a newer libc++ than the target distro has.
      - name: Install the static libc++ runtime
        if: runner.os == 'Linux'
        run: |
          . /etc/os-release
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          echo "deb http://apt.llvm.org/$VERSION_CODENAME/ llvm-toolchain-$VERSION_CODENAME-21 main" \
            | sudo tee /etc/apt/sources.list.d/llvm-21.list
          sudo apt-get update
          sudo apt-get install -y libc++-21-dev libc++abi-21-dev

      - name: Toolchain versions
        shell: bash
        run: |
          rustc --version
          cargo --version
          if [[ "${{ runner.os }}" != "Windows" ]]; then zig version; fi

      - name: Build BSH
        shell: bash
        env:
          BSH_LIBCXX_DIR: ${{ runner.os == 'Linux' && '/usr/lib/llvm-21/lib' || '' }}
          # Free arm64 runners are reclaimed mid-job; a fat-LTO, one-codegen-unit
          # link of the whole app takes 30-70 minutes there and gets killed.
          # Thin LTO plus parallel codegen keeps that platform inside the
          # window; every other platform keeps the workspace's own profile.
          CARGO_PROFILE_RELEASE_LTO: ${{ matrix.platform == 'linux-arm64' && 'thin' || 'true' }}
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: ${{ matrix.platform == 'linux-arm64' && '16' || '1' }}
        run: |
          # Ghostty's Zig build lazily fetches a few packages; a reset from
          # deps.files.ghostty.org is transient, so retry and let Zig reuse
          # whatever it already fetched.
          for attempt in 1 2 3; do
            if cargo build --release --locked -p bsh --bin bsh; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            echo "::warning::build attempt $attempt failed; retrying in 20s"
            sleep 20
          done

      # --help is answered before a window is created, so this is a real
      # execution of the release binary even on a headless runner.
      - name: Smoke-test the binary
        shell: bash
        run: |
          binary="./target/release/bsh"
          if [[ "$RUNNER_OS" == "Windows" ]]; then binary="$binary.exe"; fi
          "$binary" --help > /dev/null

      - name: Import the Apple signing certificate
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE_P12 != ''
        shell: bash
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/bsh-signing.keychain-db"
          p12="$RUNNER_TEMP/bsh-signing.p12"
          printf '%s' "$APPLE_CERTIFICATE_P12" | base64 -D > "$p12"
          security create-keychain -p bsh-signing "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p bsh-signing "$keychain"
          security import "$p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k bsh-signing "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$p12"

      - name: Package macOS app and dmg
        if: runner.os == 'macOS'
        shell: bash
        run: |
          bash scripts/ci/package-macos.sh \
            --version "$VERSION" \
            --binary target/release/bsh \
            --out dist

      - name: Package Linux deb and tarball
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bash scripts/ci/package-linux.sh \
            --version "$VERSION" \
            --binary target/release/bsh \
            --out dist

      - name: Prepare the Windows signing certificate
        if: runner.os == 'Windows' && env.WINDOWS_CERTIFICATE_PFX != ''
        shell: pwsh
        run: |
          $path = Join-Path $env:RUNNER_TEMP 'bsh-signing.pfx'
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_PFX))
          "WINDOWS_CERTIFICATE_FILE=$path" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Ensure the WiX Toolset
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $candle = Join-Path ${env:ProgramFiles(x86)} 'WiX Toolset v3.14\bin\candle.exe'
          if ((Get-Command candle.exe -ErrorAction SilentlyContinue) -or (Test-Path $candle)) {
            Write-Host 'WiX is already installed'
            exit 0
          }
          choco install wixtoolset --no-progress -y

      - name: Package Windows msi and zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: >
          ./scripts/ci/package-windows.ps1
          -Version $env:VERSION
          -Binary target/release/bsh.exe
          -Arch ${{ matrix.winarch }}
          -OutDir dist

      - name: Remove the signing keychain
        if: always() && runner.os == 'macOS' && env.APPLE_CERTIFICATE_P12 != ''
        shell: bash
        run: |
          keychain="$RUNNER_TEMP/bsh-signing.keychain-db"
          security delete-keychain "$keychain" 2>/dev/null || true

      - name: Upload the installers
        uses: actions/upload-artifact@v4
        with:
          name: bsh-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/*.dmg
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
            dist/*.msi
            dist/*.zip

  release:
    name: Publish the GitHub release
    needs: [prepare, verify, build]
    if: >-
      needs.prepare.outputs.should_release == 'true'
      && needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: bsh-*
          merge-multiple: true

      - name: Verify the artifact set
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          deb_version="$(printf '%s' "$VERSION" | sed 's/-/~/')"
          expected=(
            "bsh-${VERSION}-macos-arm64.dmg"
            "bsh-${VERSION}-macos-arm64.app.zip"
            "bsh-${VERSION}-linux-x86_64.tar.gz"
            "bsh_${deb_version}_amd64.deb"
            "bsh-${VERSION}-linux-x86_64.rpm"
            "bsh-${VERSION}-windows-x64.zip"
            "bsh-${VERSION}-windows-x64.msi"
            "bsh-${VERSION}-windows-arm64.zip"
            "bsh-${VERSION}-windows-arm64.msi"
          )
          missing=0
          for name in "${expected[@]}"; do
            if [[ ! -f "dist/$name" ]]; then
              echo "::error::missing release artifact: $name"
              missing=1
            fi
          done
          [[ "$missing" -eq 0 ]]
          ( cd dist && sha256sum -- * > SHA256SUMS )
          cat dist/SHA256SUMS

      - name: Write the release notes
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: bash scripts/ci/release-notes.sh "$VERSION" > "$RUNNER_TEMP/release-notes.md"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: BSH ${{ needs.prepare.outputs.version }}
          body_path: ${{ runner.temp }}/release-notes.md
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          # A prerelease must never become the "latest" download.
          make_latest: ${{ needs.prepare.outputs.prerelease == 'false' }}
          fail_on_unmatched_files: true
          files: |
            dist/*.dmg
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
            dist/*.msi
            dist/*.zip
            dist/SHA256SUMS
