name: jsbos pipeline
env:
  DEBUG: napi:*
  APP_NAME: brainos
  MACOSX_DEPLOYMENT_TARGET: '10.13'
  CARGO_INCREMENTAL: '1'

on:
  push:
    branches:
      - main
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Detect a version commit
    runs-on: ubuntu-latest
    outputs:
      is_release: ${{ steps.check.outputs.is_release }}
    steps:
      - uses: actions/checkout@v6

      # Publishing builds npm packages and creates a GitHub release, so it must
      # only run for a version commit or a version tag. Gating the job keeps a
      # normal push from touching the registry or an existing release.
      - id: check
        name: Check version commit
        shell: bash
        run: |
          subject=$(git log -1 --pretty=%s)
          if [ "${{ github.ref_type }}" = "tag" ] || echo "$subject" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "Not a version commit. Commit: $subject"
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build bindings for ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            build: yarn build
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
            build: yarn build
          - target: aarch64-apple-darwin
            runner: macos-latest
            build: yarn build --target aarch64-apple-darwin
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            build: yarn build --target x86_64-unknown-linux-gnu
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            build: yarn build --target aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: ./crates/jsbos
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Setup yarn
        run: corepack enable && corepack prepare yarn@4.13.0 --activate

      - name: Install dependencies
        run: yarn install --no-immutable

      - name: Build
        run: ${{ matrix.build }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: bindings-${{ matrix.target }}
          path: crates/jsbos/*.node
          retention-days: 7

  test-macos-windows:
    name: Test bindings on ${{ matrix.target }} - node@${{ matrix.node }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            host: windows-latest
            architecture: x64
            node: '20'
          - target: aarch64-pc-windows-msvc
            host: windows-11-arm
            architecture: arm64
            node: '20'
          - target: aarch64-apple-darwin
            host: macos-latest
            architecture: arm64
            node: '20'
    runs-on: ${{ matrix.host }}
    defaults:
      run:
        working-directory: ./crates/jsbos
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          architecture: ${{ matrix.architecture }}

      - name: Setup yarn
        run: corepack enable && corepack prepare yarn@4.13.0 --activate

      - name: Install dependencies
        run: yarn install --no-immutable

      - name: Download artifacts
        uses: actions/download-artifact@v6
        with:
          name: bindings-${{ matrix.target }}
          path: crates/jsbos

      - name: List artifacts
        run: ls -la *.node
        shell: bash

      - name: Run smoke test
        run: yarn test
        env:
          OPENAI_API_KEY: test-key
          LLM_MODEL: test-model

  test-linux:
    name: Test ${{ matrix.target }} - node@${{ matrix.node }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            node: '20'
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            node: '20'
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: ./crates/jsbos
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}

      - name: Setup yarn
        run: corepack enable && corepack prepare yarn@4.13.0 --activate

      - name: Install dependencies
        run: yarn install --no-immutable

      - name: Download artifacts
        uses: actions/download-artifact@v6
        with:
          name: bindings-${{ matrix.target }}
          path: crates/jsbos

      - name: List artifacts
        run: ls -la *.node
        shell: bash

      - name: Run smoke test
        run: yarn test
        env:
          OPENAI_API_KEY: test-key
          LLM_MODEL: test-model

  publish:
    name: Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    needs:
      - release
      - build
      - test-macos-windows
      - test-linux
    if: needs.release.outputs.is_release == 'true'
    defaults:
      run:
        working-directory: ./crates/jsbos
    steps:
      - uses: actions/checkout@v6

      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: 20

      # Trusted publishing has npm exchange this workflow OIDC identity
      # for registry access, which needs npm >= 11.5.1. Node 20 still
      # ships npm 10, so pin a current npm 11 before anything publishes.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11

      - name: Setup yarn
        run: corepack enable && corepack prepare yarn@4.13.0 --activate

      - name: Install dependencies
        run: yarn install --no-immutable

      - name: create npm dirs
        run: yarn napi create-npm-dirs

      - name: Download all artifacts
        uses: actions/download-artifact@v6
        with:
          path: crates/jsbos/artifacts

      - name: Create npm artifacts
        run: yarn artifacts

      - name: List packages
        run: ls -R ./npm
        shell: bash

      - name: Publish
        run: |
          npm config set provenance true
          # Publishing must be idempotent: a version commit and its v* tag
          # both trigger this workflow for the same commit, and a re-run
          # repeats it. Without this guard the second attempt fails the
          # release on an already-published version instead of no-oping.
          pkg=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "${pkg}@${version}" version >/dev/null 2>&1; then
            echo "${pkg}@${version} is already published; skipping publish."
            exit 0
          fi
          # Publish only when this push is a release: a v* tag (the tag
          # name picks the dist-tag) or a bare version commit. Auth comes
          # from npm Trusted Publishing -- npm exchanges the OIDC identity
          # of this workflow for registry access, so no _authToken is
          # written and no OTP is ever prompted. Every package published
          # from here (this one plus the per-platform ones emitted by
          # `napi prepublish`) must list this workflow as a trusted
          # publisher on npmjs.com.
          subject=$(git log -1 --pretty=%s)
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if echo "$GITHUB_REF_NAME" | grep -qE "^v?[0-9]+\.[0-9]+\.[0-9]+$"; then
              npm publish --access public
            else
              npm publish --tag next --access public
            fi
          elif echo "$subject" | grep -qE "^[0-9]+\.[0-9]+\.[0-9]+$"; then
            npm publish --access public
          elif echo "$subject" | grep -qE "^[0-9]+\.[0-9]+"; then
            npm publish --tag next --access public
          else
            echo "Not a release, skipping publish"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}