name: windows extensions

on:
  push:
    branches:
      - main
    paths:
      - "crates/ferris-core/**"
      - "crates/ferris-runtime/**"
      - ".github/workflows/windows-extensions.yml"
  pull_request:
    paths:
      - "crates/ferris-core/**"
      - "crates/ferris-runtime/**"
      - ".github/workflows/windows-extensions.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Windows extension runtimes
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust 1.98.1
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Test ferris-core and ferris-runtime
        run: cargo test -p ferris-core -p ferris-runtime --lib -- --nocapture

      - name: Lint
        run: cargo clippy -p ferris-core -p ferris-runtime --all-targets -- -D warnings
