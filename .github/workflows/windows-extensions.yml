name: windows extensions

on:
  push:
    branches:
      - main
    paths:
      - "crates/ferris-core/**"
      - "crates/ferris-runtime/**"
      - "crates/bsh/src/terminal*.rs"
      - "crates/bsh/src/ui/terminal_view.rs"
      - ".github/workflows/windows-extensions.yml"
  pull_request:
    paths:
      - "crates/ferris-core/**"
      - "crates/ferris-runtime/**"
      - "crates/bsh/src/terminal*.rs"
      - "crates/bsh/src/ui/terminal_view.rs"
      - ".github/workflows/windows-extensions.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Windows extension runtimes
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust 1.98.1
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Test ferris-core and ferris-runtime
        run: cargo test -p ferris-core -p ferris-runtime --lib -- --nocapture

      - name: Lint
        run: cargo clippy -p ferris-core -p ferris-runtime --all-targets -- -D warnings

      # The Windows terminal pane (ConPTY backend, issue #296) is Windows-only
      # code; compile-verify it on a real Windows host (the macOS dev host cannot
      # cross-check bsh because its TLS C dependency needs the Windows SDK).
      - name: Check bsh Windows terminal
        run: cargo check -p bsh

      # Run the ConPTY runtime integration test (issue #296): a real shell spawn
      # whose output must reach the screen grid, not just a compile check.
      - name: Test bsh Windows terminal
        run: cargo test -p bsh --lib terminal_windows -- --nocapture
