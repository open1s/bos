name: rust workspace

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and lint the core workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust 1.98.1
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev libsoup-3.0-dev libgdk-pixbuf-2.0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-xcb-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libfontconfig1-dev libfreetype6-dev libssl-dev libasound2-dev libxdo-dev \
            libc++-dev libc++abi-dev libxml2-dev xvfb bubblewrap

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Format
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --workspace --exclude jsbos --exclude nbos --all-targets -- -D warnings

      - name: Docs
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps

      # The binding crates are exercised by the jsbos/nbos pipelines; this job
      # covers the pure-Rust framework so a regression there is never silent.
      # The browser engine drives a real Chrome under Xvfb; those cases are
      # load-flaky on a shared Linux runner and are covered on macOS.
      - name: Test
        run: >-
          xvfb-run -a cargo test --workspace --exclude jsbos --exclude nbos
          -- --skip browser::engine::tests

      - name: Verify all BSH extension examples
        run: |
          cargo build -p bsh --bin bsh
          BSH_BIN=./target/debug/bsh bash scripts/ci/verify-bsh-examples.sh

      - name: Extension gold standard
        run: GOLD_STANDARD_RELEASE=1 bash scripts/ci/check-extension-gold-standard.sh

      - name: BOS extension SDK independence
        run: bash scripts/ci/check-ferris-independence.sh

  windows:
    name: Windows extension tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust 1.98.1
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Test extension runtime and policy
        run: >-
          cargo test -p bsh --lib extension::
          -- --skip ui::shell_tests

      # The release packages this exact binary. Building it here, not only the
      # lib, catches a Windows link or entry-point break before a release tag.
      - name: Build the BSH binary
        run: cargo build -p bsh --bin bsh

      - name: Smoke-test the binary
        shell: pwsh
        run: |
          $help = & .\target\debug\bsh.exe --help
          if (-not $help) { throw "bsh.exe --help printed nothing" }
          $help | Select-Object -First 1

      - name: Ensure the WiX Toolset
        shell: pwsh
        run: |
          $candle = Join-Path ${env:ProgramFiles(x86)} 'WiX Toolset v3.14\bin\candle.exe'
          if (-not ((Get-Command candle.exe -ErrorAction SilentlyContinue) -or (Test-Path $candle))) {
            choco install wixtoolset --no-progress -y
          }

      # Package a stand-in binary with the real WiX toolchain so the PowerShell
      # packager, the .wxs source and the artifact checks are exercised on every
      # change, not first at a release tag.
      - name: Build the Windows installer from a stand-in binary
        shell: pwsh
        run: |
          $stub = Join-Path $env:RUNNER_TEMP 'bsh-stub.exe'
          [IO.File]::WriteAllBytes($stub, [byte[]]::new(2097152))
          ./scripts/ci/package-windows.ps1 -Version 1.0.0-ci -Binary $stub -OutDir target\ci-package
          Get-ChildItem target\ci-package |
            Where-Object { $_.Extension -in '.msi', '.zip' } |
            ForEach-Object {
              if ($_.Length -lt 1MB) { throw "$($_.Name) is suspiciously small" }
              Write-Host "packaged $($_.Name) ($($_.Length) bytes)"
            }

  msrv:
    name: Build at the declared MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust 1.97
        uses: dtolnay/rust-toolchain@1.97.0

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-msrv-${{ hashFiles('Cargo.lock') }}

      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev libsoup-3.0-dev libgdk-pixbuf-2.0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-xcb-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libfontconfig1-dev libfreetype6-dev libssl-dev libasound2-dev libxdo-dev \
            libc++-dev libc++abi-dev libxml2-dev xvfb

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # Keep the workspace rust-version honest: if a dependency or the code
      # starts needing a newer compiler, this job fails instead of the docs
      # quietly going stale. --locked also keeps Cargo.lock in sync.
      - name: Check the workspace at 1.97
        run: cargo check --workspace --exclude jsbos --exclude nbos --locked

  packaging:
    name: Validate the release pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # A workflow that stops parsing is silent until it is needed, and the
      # packagers only run on a release tag. Check their structure on every
      # change: YAML parses, shell syntax, assets, and the artifact names the
      # release job verifies.
      - name: Check the release workflow and packagers
        run: bash scripts/ci/check-release-pipeline.sh

      - name: Install the packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      # Run the real dpkg-deb/rpmbuild path with a stand-in binary. The release
      # job supplies the built bsh; here the packaging logic, control files and
      # RPM spec are under test, on every change.
      - name: Build the Linux packages from a stand-in binary
        run: |
          bash scripts/ci/package-linux.sh \
            --version 0.0.0-ci \
            --binary "$(command -v true)" \
            --out target/ci-package

      - name: Inspect the Linux packages
        run: |
          dpkg-deb --info target/ci-package/*.deb
          rpm -qip target/ci-package/*.rpm
          rpm -qp --requires target/ci-package/*.rpm
          tar -tzf target/ci-package/*.tar.gz | sed -n '1,5p'

  packaging-macos:
    name: Validate the macOS packager
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6

      # /usr/bin/true is a real Mach-O, so ad-hoc signing and the bundle checks
      # run against a valid executable; the release job swaps in the built bsh.
      - name: Build a dmg from a stand-in binary
        run: |
          stub="$RUNNER_TEMP/bsh-stub"
          cp /usr/bin/true "$stub"
          bash scripts/ci/package-macos.sh \
            --version 0.0.0-ci \
            --binary "$stub" \
            --out target/ci-package

      - name: Verify the macOS artifacts
        run: |
          hdiutil verify target/ci-package/*.dmg
          unzip -l target/ci-package/*.app.zip | sed -n '1,8p'

  bindings:
    name: Lint the binding crates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-bindings-${{ hashFiles('Cargo.lock') }}

      # The core job excludes the binding crates because building them needs
      # Python and Node. That left their Rust glue never linted; cover it here.
      - name: Lint
        run: cargo clippy -p jsbos -p nbos --all-targets -- -D warnings

      # nbos is a pyo3 extension with no Rust unit tests; jsbos carries the two
      # async-tool tests below it.
      - name: Test
        run: cargo test -p jsbos
