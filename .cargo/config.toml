# Python extension modules must not link libpython: pyo3 resolves the Python
# symbols from the interpreter that loads the module. Only macOS needs the
# `-undefined,dynamic_lookup` linker flag for that; GNU ld and MSVC reject it,
# so it must stay scoped to macOS instead of applying to every workspace build
# (which would break the Linux and Windows binding builds).
[target.'cfg(target_os = "macos")']
rustflags = ["-C", "link-args=-Wl,-undefined,dynamic_lookup"]

[env]
# Let maturin auto-detect Python
PYO3_USE_ABI3 = "0"

# Cap the test harness default at four threads.
#
# bsh's 212 `#[gpui::test]` cases each boot a whole GPUI app and window, and
# a window costs ~4s of SYSTEM cpu (measured: one trivial test is 7.4s wall,
# 2.0s user, 4.4s sys). Left at one thread per core the run parks all of them
# in the window server at once - the shell_tests binary alone measured 380s
# user + 206s sys inside 85s of wall time, i.e. ~7 cores saturated - which
# starves every other process on the machine for the length of the run.
# Four keeps the same wall time (190s vs 182s at the default) while leaving
# the rest of the machine responsive. Override per run with
# `RUST_TEST_THREADS=<n> cargo test ...`.
RUST_TEST_THREADS = "4"

# A proxy must not be committed: CI runners have no local proxy, and a
# hard-coded 127.0.0.1 made every GitHub job fail before it could build. Set
# CARGO_HTTP_PROXY in the shell when a local proxy is needed.
