schema_version = "2.0"

[extension]
id = "com.example.extism-echo"
name = "Extism Echo"
version = "1.0.0"
description = "An Extism plugin contributing tools, panels, commands, prompts, contexts and provider descriptors"
authors = ["BSH Example"]
license = "MIT"

[compatibility]
host = ">=3.0.0, <4.0.0"
extension_api = "^1.0"

[runtime]
kind = "extism"

[runtime.config]
entry = "plugin.wasm"
startup = "on-demand"

[capabilities]
required = [
    "agent.tools.register",
    "ui.panels",
    "ui.commands",
    "agent.prompts.provide",
    "agent.context.provide",
]

[[contribution]]
kind = "tool"
id = "echo"

[contribution.payload]

[[contribution]]
kind = "command"
id = "greet"

[contribution.payload]

[[contribution]]
kind = "panel"
id = "status"

[contribution.payload]

[[contribution]]
kind = "prompt"
id = "hello"

[contribution.payload]

[[contribution]]
kind = "context"
id = "guide"

[contribution.payload]

[[contribution]]
kind = "model-provider"
id = "example"

[contribution.payload]

[[contribution]]
kind = "agent-provider"
id = "helper"

[contribution.payload]

[[contribution]]
kind = "theme"
id = "midnight"

[contribution.payload]

[[contribution]]
kind = "preset"
id = "reader"

[contribution.payload]

[[contribution]]
kind = "event.subscribe"
id = "workspace.changed"

[contribution.payload]

[resources]
max_memory_mb = 64
max_execution_ms = 2000

[dependencies]

[services]
provides = []
requires = []
