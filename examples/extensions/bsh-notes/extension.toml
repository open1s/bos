schema_version = "1.0"

[extension]
id = "com.bos.bsh.notes"
name = "Workspace Notes"
version = "1.0.0"
description = "First-party workspace notes served by the process runtime"
authors = ["BrickOS Team"]
license = "MIT"

[compatibility]
bsh = ">=3.0.0, <4.0.0"
extension_api = "^1.0"

[runtime]
kind = "process"
entry = "python3"
args = ["server.py"]
protocol = "jsonrpc-2.0"
startup = "on-demand"

[capabilities]
required = ["process.execute", "agent.tools.register"]

[contributes]
tools = ["save", "list"]

[resources]
max_execution_ms = 5000
max_output_bytes = 1048576
