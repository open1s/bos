schema_version = "2.0"

[extension]
id = "com.example.allinone"
name = "All-in-One Exam Demo"
version = "1.0.0"
description = "One package that exercises every BSH extension contribution: tools, commands, panels, prompts, contexts, skills, languages, integrations, themes, presets, providers, workflows, events, configuration and the process protocol"
authors = ["BSH Example"]
license = "MIT"
repository = "https://github.com/open1s/bos"
homepage = "https://github.com/open1s/bos/tree/main/examples/extensions/allinone"

[compatibility]
host = ">=3.0.0, <4.0.0"
extension_api = "^1.0"

[runtime]
kind = "process"

[runtime.config]
args = [
    "-B",
    "server.py",
]
entry = "python3"
protocol = "jsonrpc-2.0"
startup = "on-demand"

[runtime.config.env]
DEMO_GREETING = "hello from the all-in-one demo"
PYTHONDONTWRITEBYTECODE = "1"

[capabilities]
required = [
    "process.execute",
    "agent.tools.register",
]

[[contribution]]
kind = "tool"
id = "describe"

