schema_version = "2.0"

[extension]
id = "com.example.cordis-echo"
name = "Cordis Echo"
version = "1.0.0"
description = "A real Cordis apply(ctx, config) package executed by the BSH Node bridge"
authors = ["BSH Example"]
license = "MIT"

[compatibility]
host = ">=3.0.0, <4.0.0"
extension_api = "^1.0"

[runtime]
kind = "cordis"

[runtime.config]
entry = "index.js"
startup = "on-demand"

[capabilities]
required = [
    "process.execute",
    "agent.tools.register",
]

[[contribution]]
kind = "tool"
id = "echo"

[contribution.payload]

[[contribution]]
kind = "command"
id = "hello"

[contribution.payload]

[[contribution]]
kind = "skill"
id = "greet"

[contribution.payload]

[resources]

[dependencies]

[services]
provides = []
requires = []
