schema_version = "2.0"

[extension]
id = "com.bos.bsh.change-history"
name = "Change History"
version = "1.1.0"
description = "Inspect and manipulate the workspace's change history through jj (preferred) or git, with one model-callable tool and a live Git panel"
authors = ["BrickOS Team"]
license = "MIT"

[compatibility]
host = ">=3.0.0, <9.0.0"
extension_api = "^1.0"

[runtime]
kind = "cordis"

[runtime.config]
entry = "index.js"
startup = "on-demand"

[capabilities]
required = [
    "process.execute",
    "agent.tools.register",
    "ui.panels",
]

[[contribution]]
kind = "tool"
id = "change_history"

[contribution.payload]

[[contribution]]
kind = "tool"
id = "refresh"

[contribution.payload]

[[contribution]]
kind = "tool"
id = "commit"

[contribution.payload]

[[contribution]]
kind = "tool"
id = "file"

[contribution.payload]

[[contribution]]
kind = "panel"
id = "git"

[contribution.payload]

[resources]
max_execution_ms = 30000
# jj takes a working-copy lock per command; serializing calls keeps two tool
# calls from racing on the same repository.
max_concurrent_calls = 1
max_output_bytes = 1048576

[dependencies]

[services]
provides = []
requires = []
