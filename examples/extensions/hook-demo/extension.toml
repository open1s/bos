schema_version = "2.0"

[extension]
id = "com.example.hook-demo"
name = "Hook Demo"
version = "1.0.0"
description = "A process extension demonstrating every host hook point and contribution kind"
authors = ["BSH Example"]
license = "MIT"

[compatibility]
host = ">=3.0.0, <4.0.0"
extension_api = "^1.0"

[runtime]
kind = "process"

[runtime.config]
args = ["server.py"]
entry = "python3"
startup = "on-demand"

[capabilities]
required = [
    "process.execute",
    "agent.tools.register",
    "agent.prompts.provide",
    "agent.context.provide",
    "agent.skills.provide",
    "agent.models.provide",
    "agent.agents.provide",
    "agent.workflows.provide",
    "ui.panels",
    "ui.commands",
    "ui.theme",
    "events.subscribe",
]

