schema_version = "2.0"

[extension]
id = "com.example.computer-use"
name = "Computer Use"
version = "1.0.0"
description = "A real, opt-in screen, pointer and keyboard extension for macOS"
authors = ["BSH Example"]
license = "MIT"

[compatibility]
host = ">=3.0.0, <4.0.0"
extension_api = "^1.0"

[runtime]
kind = "process"

[runtime.config]
args = ["server.py"]
entry = "python3"
protocol = "jsonrpc-2.0"
startup = "on-demand"

[capabilities]
required = [
    "process.execute",
    "computer.use",
    "agent.tools.register",
    "agent.prompts.provide",
    "agent.skills.provide",
    "agent.workflows.provide",
    "ui.panels",
    "ui.commands",
    "events.subscribe",
]

[[contribution]]
kind = "tool"
id = "screen_size"

[contribution.payload]

[[contribution]]
kind = "tool"
id = "screenshot"

[contribution.payload]

[[contribution]]
kind = "tool"
id = "cursor_position"

[contribution.payload]

[[contribution]]
kind = "tool"
id = "mouse_move"

[contribution.payload]

[[contribution]]
kind = "tool"
id = "mouse_click"

[contribution.payload]

[[contribution]]
kind = "tool"
id = "mouse_drag"

[contribution.payload]

[[contribution]]
kind = "tool"
id = "scroll"

[contribution.payload]

[[contribution]]
kind = "tool"
id = "type_text"

[contribution.payload]

[[contribution]]
kind = "tool"
id = "key_press"

[contribution.payload]

[[contribution]]
kind = "command"
id = "refresh"

[contribution.payload]

[[contribution]]
kind = "panel"
id = "desktop"

[contribution.payload]

[[contribution]]
kind = "prompt"
id = "system"

[contribution.payload]

[[contribution]]
kind = "skill"
id = "computer-safety"

[contribution.payload]

[[contribution]]
kind = "workflow"
id = "inspect"

[contribution.payload]

[[contribution]]
kind = "integration"
id = "desktop.control"

[contribution.payload]

[[contribution]]
kind = "integration"
id = "desktop.refresh"

[contribution.payload]

[[contribution]]
kind = "event.subscribe"
id = "session.created"

[contribution.payload]

[[contribution]]
kind = "event.subscribe"
id = "tool.completed"

[contribution.payload]

[resources]
max_memory_mb = 256
max_execution_ms = 15000
max_concurrent_calls = 1
max_output_bytes = 1048576

[dependencies]

[services]
provides = []
requires = []
