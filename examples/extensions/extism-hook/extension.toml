schema_version = "2.0"

[extension]
id = "com.example.extism-hook"
name = "Extism Hook Observer"
version = "1.0.0"
description = "Consumes BSH observe hooks and counts them per point"
authors = ["BSH Example"]
license = "MIT"

[compatibility]
host = ">=3.0.0, <4.0.0"
extension_api = "^1.0"

[runtime]
kind = "extism"

[runtime.config]
entry = "plugin.wasm"
startup = "on-demand"

[capabilities]
required = [
    "hooks.observe",
    "extension.storage",
    "agent.tools.register",
    "ui.panels",
]

[[contribution]]
kind = "tool"
id = "stats"

[contribution.payload]

[[contribution]]
kind = "panel"
id = "inspector"

[contribution.payload]

[[contribution]]
kind = "hook"
id = "model.request"

[contribution.payload]

[[contribution]]
kind = "hook"
id = "model.response"

[contribution.payload]

[[contribution]]
kind = "hook"
id = "http.exchange"

[contribution.payload]

[resources]
max_memory_mb = 64
max_execution_ms = 2000

[dependencies]

[services]
provides = []
requires = []
