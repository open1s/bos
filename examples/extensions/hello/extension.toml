schema_version = "2.0"

[extension]
id = "com.example.hello"
name = "Hello"
version = "1.0.0"
description = "A minimal declarative extension: one echo tool, one command and one panel"
authors = ["BSH Example"]
license = "MIT"

[compatibility]
host = ">=3.0.0, <4.0.0"
extension_api = "^1.0"

[runtime]
kind = "declarative"

[runtime.config]
startup = "on-demand"

[capabilities]
required = ["agent.tools.register"]

[[contribution]]
kind = "tool"
id = "echo"

[contribution.payload]

[[contribution]]
kind = "command"
id = "greet"

[contribution.payload]

[[contribution]]
kind = "panel"
id = "status"

[contribution.payload]

[[contribution]]
kind = "prompt"
id = "hello"

[contribution.payload]

[resources]
max_execution_ms = 2000
max_output_bytes = 65536

[dependencies]

[services]
provides = []
requires = []
