[package]
name = "ferris-bindings"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Host-neutral Ferris binding helpers shared by the Python and Node.js bindings"

[features]
default = []
host = ["dep:async-trait", "dep:tokio", "ferris-sdk/host-runtime"]

[dependencies]
ferris-sdk = { path = "../ferris-sdk" }
async-trait = { workspace = true, optional = true }
serde_json.workspace = true
tokio = { workspace = true, optional = true }
