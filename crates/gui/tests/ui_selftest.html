<!doctype html>
<script>
// An uncaught load-time error would otherwise leave the runner with only
// "result block missing". Write the real message into the result block so a
// broken page reports *why* it is broken.
const reportLoadFailure = (msg) => {
  window.__dshLoadError = msg;
  const put = () => {
    const pre = document.getElementById("result");
    if (!pre) return false;
    pre.textContent = JSON.stringify({
      page: "transcript",
      failures: 1,
      checks: [{ name: "load error: " + msg, ok: false }],
    });
    return true;
  };
  if (!put()) document.addEventListener("DOMContentLoaded", put);
};
// An uncaught error and an unhandled rejection are different events, and this
// harness's flow is async: a rejected promise used to reach the runner as
// "result block missing", i.e. with no reason at all.
window.addEventListener("error", (e) => reportLoadFailure(`${e.message} @ ${e.filename}:${e.lineno}`));
window.addEventListener("unhandledrejection", (e) =>
  reportLoadFailure(
    `unhandled rejection: ${(e.reason && (e.reason.stack || e.reason.message)) || e.reason}`,
  ),
);
window.addEventListener("error", (e) => {
  window.__dshLoadError = `${e.message} @ ${e.filename}:${e.lineno}`;
  const put = () => {
    const pre = document.getElementById("result");
    if (!pre) return false;
    pre.textContent = JSON.stringify({
      page: "transcript",
      failures: 1,
      checks: [{ name: "load error: " + window.__dshLoadError, ok: false }],
    });
    return true;
  };
  if (!put()) document.addEventListener("DOMContentLoaded", put);
});
</script>
<html>
  <head>
    <meta charset="utf-8" />
    <title>BOS gui — transcript render selftest</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      /* Headless harness for the shipped ui/app.js. Run with:
         pnpm run selftest:ui   (or the Chrome command in AGENTS/docs)
         It measures the real renderer against a synthetic transcript, so
         performance claims about the transcript are numbers, not assertions.
         Everything below is synchronous: --dump-dom then sees the result
         block without needing the browser to wait on timers. */

      /* Every element app.js binds at load time. Anything else it asks for is
         auto-created, so the harness never depends on index.html. */
      const IDS = [
        "approval-allow", "approval-args", "approval-deny", "approval-diff",
        "approval-modal", "approval-tool", "cap-list", "chat-title", "cmd-list",
        "cmd-palette", "file-tree", "files-refresh", "files-toggle", "input",
        "mcp-add-btn", "mcp-cmd", "mcp-conn", "mcp-list",
        "mcp-msg", "mcp-name", "mcp-reconnect-btn", "mcp-transport", "mcp-url",
        "mention-list", "mention-pop", "messages", "new-chat", "open-settings",
        "plan-edit", "plan-panel", "prov-add-btn", "prov-key", "prov-list",
        "prov-model", "prov-msg", "prov-name", "prov-url", "queue-list",
        "run-chip", "run-clear", "run-close", "run-form", "run-input",
        "run-note", "run-output", "run-panel", "run-send", "send",
        "session-list", "session-search", "set-api-key", "set-approval",
        "set-base-url", "set-bash", "set-context-budget", "set-effort",
        "set-files", "set-instructions", "set-memory", "set-memory-path",
        "set-model", "set-skills-dir", "set-system", "set-temperature",
        "set-workspace", "settings-cancel", "settings-form", "settings-modal",
        "status-left", "status-right", "stream-chip",
        "term-kill", "term-open",
      ];
      const root = document.getElementById("root");
      for (const id of IDS) {
        const n = document.createElement("div");
        n.id = id;
        root.appendChild(n);
      }
      const realGet = document.getElementById("root").constructor
        ? document.getElementById.bind(document)
        : null;
      document.getElementById = (id) => {
        let n = realGet(id);
        if (!n) {
          n = document.createElement("div");
          n.id = id;
          document.body.appendChild(n);
        }
        return n;
      };

      /* The Tauri bridge: boot promises never settle, so app.js's init()
         cannot race the measurements below. */
      const never = () => new Promise(() => {});
      window.__TAURI__ = { core: { invoke: never }, event: { listen: never } };
    </script>
    <script src="../ui/shell.js"></script>
    <script src="../ui/app.js"></script>
    <script>
      (() => {
        const R = { checks: {} };
        const assert = (name, ok, detail) => {
          R.checks[name] = (ok ? "PASS" : "FAIL") + (detail ? " " + detail : "");
        };
        const msgsEl = document.getElementById("messages");
        const rows = () => Array.from(msgsEl.children);

        // Count layout reads on the transcript: a streaming repaint must not ask
        // the DOM for geometry merely to decide whether to follow the tail.
        const layout = { scrollHeight: 0, clientHeight: 0 };
        for (const prop of ["scrollHeight", "clientHeight"]) {
          const desc = Object.getOwnPropertyDescriptor(Element.prototype, prop);
          Object.defineProperty(msgsEl, prop, {
            configurable: true,
            get() {
              layout[prop]++;
              return desc.get.call(this);
            },
          });
        }
        const resetLayout = () => {
          layout.scrollHeight = 0;
          layout.clientHeight = 0;
        };
        const layoutReads = () => layout.scrollHeight + layout.clientHeight;

        // ---- synthetic transcript -------------------------------------
        const N = Number(new URLSearchParams(location.search).get("n")) || 5000;
        const make = (i) => ({
          role: i % 2 ? "Assistant" : "User",
          text: i % 2 ? `assistant reply ${i} with some **markdown** body` : `user question ${i}`,
          reasoning: "",
          tools: [],
          error: null,
        });
        let msgs = [];
        for (let i = 0; i < N; i++) msgs.push(make(i));
        // The structural phases below read `rowCache` as if a row exists per
        // message, which a window deliberately does not do. They run with the
        // window open, and the windowed contract gets its own phase at the end.
        state.windowExtra = N;
        state.activeId = "selftest";
        state.cache["selftest"] = msgs;
        state.streams = {};
        state.compacting = {};

        // Count bubble rebuilds so "one row changed" is measured, not assumed.
        const builds = { n: 0 };
        const realBubble = buildBubble;
        buildBubble = function (...a) {
          builds.n++;
          return realBubble.apply(this, a);
        };
        // Signature computations are the per-frame cost that used to scale with
        // the transcript, so count them too.
        const sigs = { n: 0 };
        const realSignature = messageSignature;
        messageSignature = function (...a) {
          sigs.n++;
          return realSignature.apply(this, a);
        };
        const observeOneFrame = (fn) => {
          const mo = new MutationObserver(() => {});
          mo.observe(msgsEl, { childList: true, subtree: true, characterData: true });
          fn();
          const recs = mo.takeRecords();
          mo.disconnect();
          return {
            childList: recs.filter((r) => r.type === "childList").length,
            characterData: recs.filter((r) => r.type === "characterData").length,
          };
        };

        // ---- 1. first paint -------------------------------------------
        let t = performance.now();
        renderMessages();
        R.firstRenderMs = +(performance.now() - t).toFixed(1);
        R.rowsFirstPaint = msgsEl.childElementCount;
        assert("first paint renders every message", R.rowsFirstPaint === N, `rows=${R.rowsFirstPaint}`);

        // ---- 2. streaming frame (append a token to the last message) ---
        const last = msgs[N - 1];
        const firstRow = msgsEl.firstChild;
        builds.n = 0;
        sigs.n = 0;
        resetLayout();
        t = performance.now();
        const FRAMES = 200;
        for (let i = 0; i < FRAMES; i++) {
          last.text += " tok";
          // The app's agent-event handler marks the tail; mirror that here.
          markDirty(N - 1);
          renderMessages();
        }
        R.streamingRepaintMs = +((performance.now() - t) / FRAMES).toFixed(2);
        R.buildBubbleCallsPerFrame = +(builds.n / FRAMES).toFixed(2);
        R.layoutReadsPerStreamFrame = +(layoutReads() / FRAMES).toFixed(2);
        R.signaturesPerStreamFrame = +(sigs.n / FRAMES).toFixed(2);
        assert(
          "streaming frame validates only the tail",
          R.signaturesPerStreamFrame <= 5,
          `signatures/frame=${R.signaturesPerStreamFrame} for N=${N}`,
        );
        // A frame with nothing marked must not walk the transcript at all.
        sigs.n = 0;
        resetLayout();
        t = performance.now();
        const IDLE_FRAMES = 200;
        for (let i = 0; i < IDLE_FRAMES; i++) renderMessages();
        R.idleRepaintMs = +((performance.now() - t) / IDLE_FRAMES).toFixed(3);
        R.idleSignaturesPerFrame = +(sigs.n / IDLE_FRAMES).toFixed(2);
        assert(
          "an unmarked frame walks nothing",
          R.idleRepaintMs < R.streamingRepaintMs && R.idleSignaturesPerFrame === 0,
          `idle=${R.idleRepaintMs}ms streaming=${R.streamingRepaintMs}ms sigs=${R.idleSignaturesPerFrame}`,
        );
        assert(
          "streaming frame reads no layout",
          R.layoutReadsPerStreamFrame === 0,
          `reads/frame=${R.layoutReadsPerStreamFrame}`,
        );
        // Control: a reader who scrolled up is no longer pinned to the tail, and
        // that path is allowed to read the position it must preserve.
        followTail = false;
        resetLayout();
        last.text += " tok";
        markDirty(N - 1);
        renderMessages();
        R.layoutReadsWhenDetached = layoutReads();
        followTail = true;

        // ---- 2b. the validation cursor is a real fast path -------------
        // An in-place change below the cursor stays invisible until the mutator
        // says so — that is exactly what keeps a streamed token O(1).
        msgs[2].text = "changed in place, unmarked";
        builds.n = 0;
        t = performance.now();
        renderMessages();
        R.unmarkedInPlaceMs = +(performance.now() - t).toFixed(2);
        R.unmarkedInPlaceRebuilds = builds.n;
        assert(
          "unmarked in-place change below the cursor is not rebuilt",
          R.unmarkedInPlaceRebuilds === 0,
          `rebuilds=${R.unmarkedInPlaceRebuilds}`,
        );
        markDirty(2);
        builds.n = 0;
        t = performance.now();
        renderMessages();
        R.markedInPlaceRebuilds = builds.n;
        R.markedInPlaceMs = +(performance.now() - t).toFixed(2);
        assert(
          "marking a row makes it rebuild",
          R.markedInPlaceRebuilds === 1,
          `rebuilds=${R.markedInPlaceRebuilds}`,
        );
        assert(
          "the marked rebuild shows the new text",
          rowCache
            .get(msgKey(msgs[2]))
            .el.textContent.includes("changed in place"),
        );

        builds.n = 0;
        last.text += " tail";
        markDirty(N - 1);
        const streamFrame = observeOneFrame(() => renderMessages());
        R.streamFrameChildListMutations = streamFrame.childList;
        R.streamFrameBubbleRebuilds = builds.n;
        R.firstRowNodePreserved = msgsEl.firstChild === firstRow;
        R.rowsAfterStreaming = msgsEl.childElementCount;
        R.streamedTextVisible = msgsEl.lastChild.textContent.includes("tail");
        assert("one row rebuilt per streaming frame",
          R.buildBubbleCallsPerFrame <= 1.001, `calls/frame=${R.buildBubbleCallsPerFrame}`);
        assert("streaming frame only touches the growing row",
          streamFrame.childList <= 2 && R.streamFrameBubbleRebuilds === 1,
          `childList=${streamFrame.childList} rebuilds=${R.streamFrameBubbleRebuilds}`);
        assert("untouched rows keep their DOM nodes", R.firstRowNodePreserved);
        assert("transcript still shows the streamed text", R.streamedTextVisible);
        assert("row count unchanged while streaming", R.rowsAfterStreaming === N,
          `rows=${R.rowsAfterStreaming}`);

        // ---- 3. update early in the transcript (a tool result landing) --
        // This must cost O(1) DOM work, not a shift of every later row.
        const sibling = rows()[100];
        const beforeRows = msgsEl.childElementCount;
        msgs[2] = {
          role: "Assistant",
          text: "early reply",
          reasoning: "",
          tools: [{ name: "bash", args: '{"command":"ls"}', output: "out", ms: 3 }],
          error: null,
        };
        // A replacement is a new message object (a new key), which the cursor
        // contract requires the mutator to announce.
        markDirtyAll();
        builds.n = 0;
        t = performance.now();
        const midFrame = observeOneFrame(() => renderMessages());
        R.earlyUpdateMs = +(performance.now() - t).toFixed(2);
        R.earlyUpdateChildListMutations = midFrame.childList;
        R.earlyUpdateBubbleRebuilds = builds.n;
        R.laterSiblingNodePreserved = rows()[100] === sibling;
        R.rowsAfterEarlyUpdate = msgsEl.childElementCount;
        assert("early update rebuilds exactly one row", R.earlyUpdateBubbleRebuilds === 1,
          `rebuilds=${R.earlyUpdateBubbleRebuilds}`);
        assert("early update does not shift later rows",
          R.earlyUpdateChildListMutations <= 2 && R.laterSiblingNodePreserved,
          `childList=${R.earlyUpdateChildListMutations} siblingPreserved=${R.laterSiblingNodePreserved}`);
        assert("early update keeps the row count", R.rowsAfterEarlyUpdate === beforeRows,
          `rows=${R.rowsAfterEarlyUpdate}`);

        // ---- 4. control: the previous wipe-and-rebuild renderer ---------
        const CTRL = 5;
        builds.n = 0;
        t = performance.now();
        for (let f = 0; f < CTRL; f++) {
          msgsEl.textContent = "";
          msgs.forEach((m, i) => {
            const row = el("div", "msg " + (m.role === "User" ? "user" : "assistant"));
            row.appendChild(buildBubble(m, false, { index: i }));
            msgsEl.appendChild(row);
          });
        }
        R.fullRebuildMsPerFrame = +((performance.now() - t) / CTRL).toFixed(1);
        R.fullRebuildBubblesPerFrame = +(builds.n / CTRL).toFixed(1);
        R.speedupVsFullRebuild = +(R.fullRebuildMsPerFrame / R.streamingRepaintMs).toFixed(0);
        buildBubble = realBubble;
        rowCache.clear();          // the control loop orphaned the cached rows
        renderMessages();

        // ---- 5. structural correctness --------------------------------
        msgs = state.cache["selftest"];
        const extra = make(N);
        msgs.push(extra);
        renderMessages();
        R.afterAppendRows = msgsEl.childElementCount;
        assert("append adds exactly one row at the tail",
          R.afterAppendRows === N + 1 && msgsEl.lastChild.textContent.includes(`${N}`),
          `rows=${R.afterAppendRows}`);

        msgs.splice(3, 1);
        renderMessages();
        R.afterDeleteRows = msgsEl.childElementCount;
        assert("delete removes exactly one row", R.afterDeleteRows === N, `rows=${R.afterDeleteRows}`);

        const swapped = msgs.slice();
        const tmp = swapped[0];
        swapped[0] = swapped[swapped.length - 1];
        swapped[swapped.length - 1] = tmp;
        state.cache["selftest"] = swapped;
        renderMessages();
        R.orderFollowsModel = msgsEl.firstChild.textContent.includes(`${N}`) &&
          msgsEl.childElementCount === swapped.length;
        assert("row order follows the message order", R.orderFollowsModel);

        // ---- 6. tool cards, diff coloring, and its safety gate ---------
        state.cache["selftest"] = [{
          role: "Assistant",
          text: "done",
          reasoning: "thinking",
          tools: [{
            name: "bash",
            args: '{"command":"git diff"}',
            output: "--- a/f.txt\n+++ b/f.txt\n@@ -1,2 +1,2 @@\n keep\n-removed\n+added",
            ms: 12,
            open: true,
          }],
          error: null,
        }];
        renderMessages();
        R.toolCards = msgsEl.querySelectorAll(".tool-card").length;
        R.diffAdds = msgsEl.querySelectorAll(".d-add").length;
        R.diffDels = msgsEl.querySelectorAll(".d-del").length;
        R.diffCtx = msgsEl.querySelectorAll(".d-ctx").length;
        assert("tool card renders", R.toolCards === 1, `cards=${R.toolCards}`);
        assert("unified diff is colored",
          R.diffAdds === 1 && R.diffDels === 1 && R.diffCtx === 3,
          `add=${R.diffAdds} del=${R.diffDels} ctx=${R.diffCtx}`);

        // Ordinary output that merely starts with +/- must stay uncolored:
        // tool output is untrusted, so heuristic coloring needs a diff header.
        state.cache["selftest"] = [{
          role: "Assistant",
          text: "",
          reasoning: "",
          tools: [{ name: "bash", args: "{}", output: "+ not a diff\n- still not", ms: 1, open: true }],
          error: null,
        }];
        renderMessages();
        R.plainOutputColored = msgsEl.querySelectorAll(".d-add, .d-del").length;
        assert("non-diff output is not colored", R.plainOutputColored === 0,
          `colored=${R.plainOutputColored}`);

        // ---- 7. empty state -------------------------------------------
        state.cache["selftest"] = [];
        renderMessages();
        R.emptyStateRows = msgsEl.childElementCount;
        assert("empty transcript shows the hint", R.emptyStateRows === 1,
          `rows=${R.emptyStateRows}`);

        // ---- 7. relative ages + sidebar navigation ---------------------
        const NOW = 1_800_000_000;
        assert("age: just now", fmtAge(NOW - 5, NOW) === "now", fmtAge(NOW - 5, NOW));
        assert("age: minutes", fmtAge(NOW - 90, NOW) === "2m", fmtAge(NOW - 90, NOW));
        assert("age: hours", fmtAge(NOW - 3 * 3600, NOW) === "3h", fmtAge(NOW - 3 * 3600, NOW));
        assert("age: days", fmtAge(NOW - 3 * 86400, NOW) === "3d", fmtAge(NOW - 3 * 86400, NOW));
        assert(
          "age: falls back to a date after a week",
          fmtAge(NOW - 30 * 86400, NOW) === fmtTime(NOW - 30 * 86400).slice(0, 5),
          fmtAge(NOW - 30 * 86400, NOW),
        );
        assert("navigation routes to a panel", typeof navTo === "function");
        assert(
          "sidebar navigation is wired",
          !!document.getElementById("nav-plugins") && !!document.getElementById("nav-mcp"),
        );

        // ---- 8. sessions group by workspace -----------------------------
        const wsGroups = groupSessions(
          [
            { id: "a", title: "a", workspace: "w1" },
            { id: "b", title: "b", workspace: "w2" },
            { id: "c", title: "c", workspace: "" },
          ],
          [
            { id: "w1", name: "bos", root: "/p/bos", model: "m1" },
            { id: "w2", name: "notes", root: "/notes", model: "" },
          ],
          "w1",
        );
        assert(
          "a session with no workspace joins the active one",
          wsGroups.length === 2 && wsGroups[0].sessions.length === 2,
          `groups=${wsGroups.length} first=${(wsGroups[0] || {}).sessions?.length}`,
        );
        assert(
          "a group carries the name, root and bound model",
          wsGroups[0].name === "bos" && wsGroups[0].root === "/p/bos" && wsGroups[0].model === "m1",
          JSON.stringify({ n: wsGroups[0].name, r: wsGroups[0].root, m: wsGroups[0].model }),
        );
        assert(
          "an unknown workspace still lists its chats",
          groupSessions([{ id: "d", title: "d", workspace: "gone" }], [], "w1")[0].name === "gone",
        );

        // ---- 9. workspace management in the panel -----------------------
        renderSidebar();
        assert(
          "the panel offers a way to add a workspace",
          !!sessionList.querySelector(".ws-add"),
          "no .ws-add in the rendered panel",
        );
        openWorkspaceForm("create", "");
        assert(
          "the add form replaces the add button",
          !!document.querySelector(".ws-form") && !document.querySelector(".ws-add"),
        );
        assert(
          "the create form asks for a name and a root",
          !!document.querySelector(".ws-form .ws-name") &&
            !!document.querySelector(".ws-form .ws-root"),
        );
        state.workspaces = [{ id: "w1", name: "bos", root: "/p/bos", model: "m1" }];
        openWorkspaceForm("edit", "w1");
        const editName = document.querySelector(".ws-form .ws-name");
        assert(
          "the edit form is prefilled from the workspace",
          !!editName && editName.value === "bos",
          editName ? `name=${editName.value}` : "no field",
        );
        openWorkspaceForm("remove", "w1");
        assert(
          "removing a workspace asks what to do with its chats",
          !!document.querySelector(".ws-del-chats") && !document.querySelector(".ws-name"),
        );
        closeWorkspaceForm();
        assert("closing the form brings the add button back", !!sessionList.querySelector(".ws-add"));

        // ---- 10. per-workspace tool selection ---------------------------
        state.workspaces = [
          { id: "w1", name: "bos", root: "/p/bos", model: "m1", disabled_tools: ["list_dir"] },
        ];
        state.wsEdit = { mode: "edit", id: "w1" };
        renderSidebar();
        const toolForm = sessionList.querySelector(".ws-form");
        const boxes = toolForm ? [...toolForm.querySelectorAll(".ws-tool")] : [];
        assert(
          "the workspace form lists every built-in tool",
          boxes.length === BUILTIN_TOOLS.length,
          `boxes=${boxes.length}`,
        );
        assert(
          "a tool the workspace denies opens unchecked",
          (boxes.find((b) => b.value === "list_dir") || {}).checked === false,
        );
        assert(
          "and the others open checked",
          (boxes.find((b) => b.value === "bash") || {}).checked === true,
        );
        boxes.forEach((b) => {
          b.checked = b.value !== "bash";
        });
        assert(
          "switching a tool off yields a deny-list, not a full snapshot",
          JSON.stringify(disabledToolsFromForm(toolForm)) === JSON.stringify(["bash"]),
          JSON.stringify(disabledToolsFromForm(toolForm)),
        );
        closeWorkspaceForm();

        // ---- 11. MCP servers are opt-in per workspace --------------------
        state.workspaces = [
          {
            id: "w1",
            name: "bos",
            root: "/p/bos",
            model: "m1",
            disabled_tools: [],
            mcp_servers: [
              { name: "fs", enabled: true, command: "npx" },
              { name: "git", enabled: false, command: "git-mcp" },
            ],
          },
        ];
        state.wsEdit = { mode: "edit", id: "w1" };
        renderSidebar();
        const mcpForm = sessionList.querySelector(".ws-form");
        const mcpBoxes = mcpForm ? [...mcpForm.querySelectorAll(".ws-mcp")] : [];
        assert(
          "the workspace form lists the configured MCP servers",
          mcpBoxes.length === 2,
          `boxes=${mcpBoxes.length}`,
        );
        assert(
          "an enabled server opens ticked",
          (mcpBoxes.find((b) => b.value === "fs") || {}).checked === true,
        );
        assert(
          "a disabled server opens unticked",
          (mcpBoxes.find((b) => b.value === "git") || {}).checked === false,
        );
        // Untick "fs" and leave "git" as rendered: the payload must carry both
        // entries with their transports, only the flag changed.
        mcpBoxes.forEach((b) => {
          if (b.value === "fs") b.checked = false;
        });
        const picked = mcpSelectionFromForm(mcpForm, state.workspaces[0]);
        assert(
          "switching a server off keeps its definition and only flips enabled " +
            JSON.stringify(picked).slice(0, 160),
          picked.length === 2 &&
            picked[0].command === "npx" &&
            picked[0].enabled === false &&
            picked[1].enabled === false,
          JSON.stringify(picked),
        );
        closeWorkspaceForm();

        // ---- 12. per-workspace skill selection ---------------------------
        state.skills = [{ name: "calculator" }, { name: "code-review" }];
        state.workspaces = [
          {
            id: "w1",
            name: "bos",
            root: "/p/bos",
            model: "m1",
            disabled_skills: ["code-review"],
            mcp_servers: [],
          },
        ];
        state.wsEdit = { mode: "edit", id: "w1" };
        renderSidebar();
        const skillForm = sessionList.querySelector(".ws-form");
        const skillBoxes = skillForm ? [...skillForm.querySelectorAll(".ws-skill")] : [];
        assert(
          "the workspace form lists the skills " + JSON.stringify(skillBoxes.map((b) => b.value)),
          skillBoxes.length === 2,
        );
        assert(
          "a denied skill opens unticked",
          (skillBoxes.find((b) => b.value === "code-review") || {}).checked === false,
        );
        assert(
          "an allowed skill opens ticked",
          (skillBoxes.find((b) => b.value === "calculator") || {}).checked === true,
        );
        skillBoxes.forEach((b) => {
          if (b.value === "calculator") b.checked = false;
        });
        assert(
          "denying a skill yields exactly that name",
          JSON.stringify(disabledSkillsFromForm(skillForm)) ===
            JSON.stringify(["calculator", "code-review"]),
          JSON.stringify(disabledSkillsFromForm(skillForm)),
        );
        // A denied skill stays listed even before the capability listing loads.
        state.skills = [];
        assert(
          "a stored denial is still visible with no listing loaded",
          JSON.stringify(skillNamesFor(state.workspaces[0])) === JSON.stringify(["code-review"]),
        );
        closeWorkspaceForm();

        // same loop with the window open — same frames, same mutation, one flag.
        const frames = 120;

        // which slides the window by one and must therefore drop a row and sign a
        // row rather than redraw everything.

          const arr = [];
          for (let i = 0; i < N; i++) arr.push(make(i));

          state.windowExtra = extra;

          renderMessages();
          // Rows, not children: the scroller also holds the spacer that stands
          // in for the rows above the window, and counting that as a row made
          // this phase fail the moment the spacer was added.
          const rows = rowCache.size;
          const t0 = performance.now();
          for (let f = 0; f < frames; f++) {
            if (append) arr.push(make(N + f));
            else arr[arr.length - 1].text = `tail ${f} ${"x".repeat(f % 40)}`;
            markDirty(arr.length - 1);
            renderMessages();
          }
          return { ms: +((performance.now() - t0) / frames).toFixed(3), rows };
        };

        R.unwindowedStreamMsPerFrame = unwindowed.ms;

        const refusedFooter = formatRunFooter({
          exit_code: null,
          lines: 0,
          duration_ms: 0,
          truncated: true,
          error: "could not start: nope",
        });
        assert(
          `a refused run and a budget cut both say so (${refusedFooter})`,
          refusedFooter ===
            "[stopped · 0 lines · 0.0s · stopped by the budget · could not start: nope]",
        );

        // The panel follows open state in both directions...
        const runPanel = $("run-panel");
        const runOut = $("run-output");
        const savedRunPanel = JSON.parse(JSON.stringify(state.runPanel));
        toggleRunPanel();
        assert(
          `the run panel opens on demand (open=${state.runPanel.open} hidden=${runPanel.hidden})`,
          state.runPanel.open === true && runPanel.hidden === false,
        );
        toggleRunPanel();
        assert(
          `the run panel closes again (open=${state.runPanel.open} hidden=${runPanel.hidden})`,
          state.runPanel.open === false && runPanel.hidden === true,
        );
        toggleRunPanel();
        assert(
          `...and reopens (open=${state.runPanel.open} hidden=${runPanel.hidden})`,
          state.runPanel.open === true && runPanel.hidden === false,
        );

        // ...and repaints kept lines as labelled text: stderr marked, an
        // angle-bracket payload rendered literally, never parsed as HTML.
        state.runPanel.lines = [];
        pushRunLine("stdout", "hello");
        pushRunLine("stderr", "<b>not html</b>");
        pushRunLine("note", "[exit 0 · 2 lines · 0.1s]");
        renderRunPanel();
        assert(
          "output renders as three labelled text lines (no HTML sink)",
          runOut.querySelectorAll(".run-line.err").length === 1 &&
            runOut.querySelector(".run-line.err").textContent ===
              "<b>not html</b>" &&
            runOut.querySelector("b") === null &&
            runOut.textContent.includes("hello") &&
            runOut.textContent.includes("[exit 0 · 2 lines · 0.1s]"),
        );

        setRunChip(true);
        assert(
          `the chip announces a run in flight (text=${$("run-chip").textContent} class=${$(
            "run-chip",
          ).className})`,
          $("run-chip").textContent === "running" &&
            $("run-chip").className === "chip streaming",
        );
        setRunChip(false);
        assert(
          `the chip falls back to idle (${$("run-chip").textContent} / ${$("run-chip").className})`,
          $("run-chip").textContent === "idle" && $("run-chip").className === "chip idle",
        );
        assert(
          "the palette carries /run",
          BUILTIN_COMMANDS.some((c) => c.name === "/run"),
        );

        // A reload should bring the panel back as it was: open stays open,
        // lines come with it. The blob gained an open flag, and the bare
        // array it used to be must still load — pure parser, pinned here.
        const blobArray = parseRunBlob([{ stream: "stdout", text: "hi" }]);
        assert(
          "the old bare-array blob still loads, closed",
          blobArray.open === false &&
            blobArray.lines.length === 1 &&
            blobArray.lines[0].text === "hi",
        );
        const blobOpen = parseRunBlob({
          open: true,
          lines: [{ stream: "stderr", text: "e" }],
        });
        assert(
          "an open panel comes back open after a reload",
          blobOpen.open === true && blobOpen.lines.length === 1,
        );
        const blobJunk = parseRunBlob({ nope: 1 });
        assert(
          "a malformed blob degrades to an empty, closed panel",
          blobJunk.open === false && blobJunk.lines.length === 0,
        );

        // The blob gained a mode after the open flag; the two older shapes
        // still load, and a mode that is not exactly "term" is run mode.
        const blobTerm = parseRunBlob({ open: true, mode: "term", lines: [] });
        assert(
          "a term-mode panel comes back in term mode",
          blobTerm.open === true && blobTerm.mode === "term",
        );
        const blobBadMode = parseRunBlob({ open: true, mode: "TUI?", lines: [] });
        assert(
          "a garbage mode degrades to run mode, never a crash",
          blobBadMode.mode === "run",
        );
        assert(
          "the old bare-array blob still loads as run mode",
          parseRunBlob([{ stream: "stdout", text: "hi" }]).mode === "run",
        );
        assert(
          "the palette carries /term next to /run",
          BUILTIN_COMMANDS.some((c) => c.name === "/term"),
        );

        // Term chunks may split a line mid-way; the panel holds the tail
        // until the newline lands, then emits whole lines only.
        state.runPanel.partial = "";
        state.runPanel.lines = [];
        pushTermChunk("abc");
        const heldWhole = state.runPanel.lines.length === 0 && state.runPanel.partial === "abc";
        pushTermChunk("def\nnext");
        assert(
          "a split line is held, then flushed whole",
          heldWhole &&
            state.runPanel.lines.length === 1 &&
            state.runPanel.lines[0].text === "abcdef" &&
            state.runPanel.partial === "next",
        );

        // The note and the chip speak the mode: a terminal must say so.
        setRunMode("term");
        const termNoteOk =
          $("run-note").textContent.includes("interactive shell") &&
          $("run-panel").classList.contains("term");
        setRunMode("run");
        assert(
          "the honesty note swaps with the mode (term ↔ run)",
          termNoteOk &&
            $("run-note").textContent.includes("plain text") &&
            !$("run-panel").classList.contains("term"),
        );
        setRunChip(true, "attached");
        assert(
          `the chip can announce an attached session (${$("run-chip").textContent})`,
          $("run-chip").textContent === "attached" &&
            $("run-chip").className === "chip streaming",
        );
        setRunChip(false, "exit 7");
        assert(
          "the chip can announce a dead session with its code",
          $("run-chip").textContent === "exit 7" &&
            $("run-chip").className === "chip idle",
        );

        state.runPanel = savedRunPanel;
        setRunMode(savedRunPanel.mode || "run");
        renderRunPanel();

        R.failures = Object.values(R.checks).filter((v) => v.startsWith("FAIL")).length;
        const pre = document.createElement("pre");
        pre.id = "result";
        pre.textContent = JSON.stringify(R, null, 2);
        document.body.appendChild(pre);
      })();
    </script>
  </body>
</html>
