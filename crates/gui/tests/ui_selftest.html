<!doctype html>
<script>
// An uncaught load-time error would otherwise leave the runner with only
// "result block missing". Write the real message into the result block so a
// broken page reports *why* it is broken.
const reportLoadFailure = (msg) => {
  window.__dshLoadError = msg;
  const put = () => {
    const pre = document.getElementById("result");
    if (!pre) return false;
    pre.textContent = JSON.stringify({
      page: "transcript",
      failures: 1,
      checks: [{ name: "load error: " + msg, ok: false }],
    });
    return true;
  };
  if (!put()) document.addEventListener("DOMContentLoaded", put);
};
// An uncaught error and an unhandled rejection are different events, and this
// harness's flow is async: a rejected promise used to reach the runner as
// "result block missing", i.e. with no reason at all.
window.addEventListener("error", (e) => reportLoadFailure(`${e.message} @ ${e.filename}:${e.lineno}`));
window.addEventListener("unhandledrejection", (e) =>
  reportLoadFailure(
    `unhandled rejection: ${(e.reason && (e.reason.stack || e.reason.message)) || e.reason}`,
  ),
);
window.addEventListener("error", (e) => {
  window.__dshLoadError = `${e.message} @ ${e.filename}:${e.lineno}`;
  const put = () => {
    const pre = document.getElementById("result");
    if (!pre) return false;
    pre.textContent = JSON.stringify({
      page: "transcript",
      failures: 1,
      checks: [{ name: "load error: " + window.__dshLoadError, ok: false }],
    });
    return true;
  };
  if (!put()) document.addEventListener("DOMContentLoaded", put);
});
</script>
<html>
  <head>
    <meta charset="utf-8" />
    <title>BOS gui — transcript render selftest</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      /* Headless harness for the shipped ui/app.js. Run with:
         pnpm run selftest:ui   (or the Chrome command in AGENTS/docs)
         It measures the real renderer against a synthetic transcript, so
         performance claims about the transcript are numbers, not assertions.
         Everything below is synchronous: --dump-dom then sees the result
         block without needing the browser to wait on timers. */

      /* Every element app.js binds at load time. Anything else it asks for is
         auto-created, so the harness never depends on index.html. */
      const IDS = [
        "approval-allow", "approval-args", "approval-deny", "approval-diff",
        "approval-modal", "approval-tool", "cap-list", "chat-title", "cmd-list",
        "cmd-palette", "file-tree", "files-refresh", "files-section", "input",
        "mcp-add-btn", "mcp-cmd", "mcp-conn", "mcp-list",
        "mcp-msg", "mcp-name", "mcp-reconnect-btn", "mcp-transport", "mcp-url",
        "mention-list", "mention-pop", "messages", "open-settings",
        "plan-edit", "plan-panel", "prov-add-btn", "prov-key", "prov-list",
        "prov-model", "prov-msg", "prov-name", "prov-url", "queue-list",
        "run-chip", "run-clear", "run-close", "run-form", "run-input",
        "run-note", "run-output", "run-panel", "run-send", "send",
        "session-list", "session-search", "session-view", "set-api-key", "set-approval",
        "set-base-url", "set-bash", "set-context-budget", "set-effort",
        "set-files", "set-instructions", "set-memory", "set-memory-path",
        "set-model", "set-skills-dir", "set-system", "set-temperature",
        "set-workspace", "settings-cancel", "settings-form", "settings-modal",
        "status-left", "status-right", "stream-chip", "stream-line",
        "working-badge", "working-close", "working-state", "working-stop", "working-title",
        "term-kill", "term-open", "workspace-add-primary",
      ];
      const root = document.getElementById("root");
      for (const id of IDS) {
        const n = document.createElement("div");
        n.id = id;
        root.appendChild(n);
      }
      /* The Settings rail, as far as this fixture needs it. The Files section is
         the one section whose content is a *fetch* rather than a render of state
         already in hand, so the gesture that selects it is the gesture that loads
         it — and the tab has to exist before app.js binds every `.set-tab`. */
      const filesPane = document.getElementById("files-section");
      filesPane.className = "set-pane";
      const filesTab = document.createElement("button");
      filesTab.type = "button";
      filesTab.className = "set-tab";
      filesTab.id = "set-tab-files-section";
      filesTab.dataset.section = "files-section";
      root.appendChild(filesTab);
      const realGet = document.getElementById("root").constructor
        ? document.getElementById.bind(document)
        : null;
      document.getElementById = (id) => {
        let n = realGet(id);
        if (!n) {
          n = document.createElement("div");
          n.id = id;
          document.body.appendChild(n);
        }
        return n;
      };

      /* The Tauri bridge: boot promises never settle, so app.js's init()
         cannot race the measurements below. */
      const never = () => new Promise(() => {});
      window.__TAURI__ = { core: { invoke: never }, event: { listen: never } };
    </script>
    <script src="../ui/shell.js"></script>
    <script src="../ui/app.js"></script>
    <script>
      (() => {
        const R = { checks: {} };
        const assert = (name, ok, detail) => {
          R.checks[name] = (ok ? "PASS" : "FAIL") + (detail ? " " + detail : "");
        };
        const msgsEl = document.getElementById("messages");
        const rows = () => Array.from(msgsEl.children);

        // Count layout reads on the transcript: a streaming repaint must not ask
        // the DOM for geometry merely to decide whether to follow the tail.
        const layout = { scrollHeight: 0, clientHeight: 0 };
        for (const prop of ["scrollHeight", "clientHeight"]) {
          const desc = Object.getOwnPropertyDescriptor(Element.prototype, prop);
          Object.defineProperty(msgsEl, prop, {
            configurable: true,
            get() {
              layout[prop]++;
              return desc.get.call(this);
            },
          });
        }
        const resetLayout = () => {
          layout.scrollHeight = 0;
          layout.clientHeight = 0;
        };
        const layoutReads = () => layout.scrollHeight + layout.clientHeight;

        // ---- synthetic transcript -------------------------------------
        const N = Number(new URLSearchParams(location.search).get("n")) || 5000;
        const make = (i) => ({
          role: i % 2 ? "Assistant" : "User",
          text: i % 2 ? `assistant reply ${i} with some **markdown** body` : `user question ${i}`,
          reasoning: "",
          tools: [],
          error: null,
        });
        let msgs = [];
        for (let i = 0; i < N; i++) msgs.push(make(i));
        // The structural phases below read `rowCache` as if a row exists per
        // message, which a window deliberately does not do. They run with the
        // window open, and the windowed contract gets its own phase at the end.
        state.windowExtra = N;
        state.activeId = "selftest";
        state.cache["selftest"] = msgs;
        state.streams = {};
        state.compacting = {};

        // Count bubble rebuilds so "one row changed" is measured, not assumed.
        const builds = { n: 0 };
        const realBubble = buildBubble;
        buildBubble = function (...a) {
          builds.n++;
          return realBubble.apply(this, a);
        };
        // Signature computations are the per-frame cost that used to scale with
        // the transcript, so count them too.
        const sigs = { n: 0 };
        const realSignature = messageSignature;
        messageSignature = function (...a) {
          sigs.n++;
          return realSignature.apply(this, a);
        };
        const observeOneFrame = (fn) => {
          const mo = new MutationObserver(() => {});
          mo.observe(msgsEl, { childList: true, subtree: true, characterData: true });
          fn();
          const recs = mo.takeRecords();
          mo.disconnect();
          return {
            childList: recs.filter((r) => r.type === "childList").length,
            characterData: recs.filter((r) => r.type === "characterData").length,
          };
        };

        // ---- 1. first paint -------------------------------------------
        let t = performance.now();
        renderMessages();
        R.firstRenderMs = +(performance.now() - t).toFixed(1);
        R.rowsFirstPaint = msgsEl.childElementCount;
        assert("first paint renders every message", R.rowsFirstPaint === N, `rows=${R.rowsFirstPaint}`);

        // ---- 2. streaming frame (append a token to the last message) ---
        const last = msgs[N - 1];
        const firstRow = msgsEl.firstChild;
        builds.n = 0;
        sigs.n = 0;
        resetLayout();
        t = performance.now();
        const FRAMES = 200;
        for (let i = 0; i < FRAMES; i++) {
          last.text += " tok";
          // The app's agent-event handler marks the tail; mirror that here.
          markDirty(N - 1);
          renderMessages();
        }
        R.streamingRepaintMs = +((performance.now() - t) / FRAMES).toFixed(2);
        R.buildBubbleCallsPerFrame = +(builds.n / FRAMES).toFixed(2);
        R.layoutReadsPerStreamFrame = +(layoutReads() / FRAMES).toFixed(2);
        R.signaturesPerStreamFrame = +(sigs.n / FRAMES).toFixed(2);
        assert(
          "streaming frame validates only the tail",
          R.signaturesPerStreamFrame <= 5,
          `signatures/frame=${R.signaturesPerStreamFrame} for N=${N}`,
        );
        // A frame with nothing marked must not walk the transcript at all.
        sigs.n = 0;
        resetLayout();
        t = performance.now();
        const IDLE_FRAMES = 200;
        for (let i = 0; i < IDLE_FRAMES; i++) renderMessages();
        R.idleRepaintMs = +((performance.now() - t) / IDLE_FRAMES).toFixed(3);
        R.idleSignaturesPerFrame = +(sigs.n / IDLE_FRAMES).toFixed(2);
        assert(
          "an unmarked frame walks nothing",
          R.idleRepaintMs < R.streamingRepaintMs && R.idleSignaturesPerFrame === 0,
          `idle=${R.idleRepaintMs}ms streaming=${R.streamingRepaintMs}ms sigs=${R.idleSignaturesPerFrame}`,
        );
        assert(
          "streaming frame reads no layout",
          R.layoutReadsPerStreamFrame === 0,
          `reads/frame=${R.layoutReadsPerStreamFrame}`,
        );
        // Control: a reader who scrolled up is no longer pinned to the tail, and
        // that path is allowed to read the position it must preserve.
        followTail = false;
        resetLayout();
        last.text += " tok";
        markDirty(N - 1);
        renderMessages();
        R.layoutReadsWhenDetached = layoutReads();
        followTail = true;

        // ---- 2b. the validation cursor is a real fast path -------------
        // An in-place change below the cursor stays invisible until the mutator
        // says so — that is exactly what keeps a streamed token O(1).
        msgs[2].text = "changed in place, unmarked";
        builds.n = 0;
        t = performance.now();
        renderMessages();
        R.unmarkedInPlaceMs = +(performance.now() - t).toFixed(2);
        R.unmarkedInPlaceRebuilds = builds.n;
        assert(
          "unmarked in-place change below the cursor is not rebuilt",
          R.unmarkedInPlaceRebuilds === 0,
          `rebuilds=${R.unmarkedInPlaceRebuilds}`,
        );
        markDirty(2);
        builds.n = 0;
        t = performance.now();
        renderMessages();
        R.markedInPlaceRebuilds = builds.n;
        R.markedInPlaceMs = +(performance.now() - t).toFixed(2);
        assert(
          "marking a row makes it rebuild",
          R.markedInPlaceRebuilds === 1,
          `rebuilds=${R.markedInPlaceRebuilds}`,
        );
        assert(
          "the marked rebuild shows the new text",
          rowCache
            .get(msgKey(msgs[2]))
            .el.textContent.includes("changed in place"),
        );

        builds.n = 0;
        last.text += " tail";
        markDirty(N - 1);
        const streamFrame = observeOneFrame(() => renderMessages());
        R.streamFrameChildListMutations = streamFrame.childList;
        R.streamFrameBubbleRebuilds = builds.n;
        R.firstRowNodePreserved = msgsEl.firstChild === firstRow;
        R.rowsAfterStreaming = msgsEl.childElementCount;
        R.streamedTextVisible = msgsEl.lastChild.textContent.includes("tail");
        assert("one row rebuilt per streaming frame",
          R.buildBubbleCallsPerFrame <= 1.001, `calls/frame=${R.buildBubbleCallsPerFrame}`);
        assert("streaming frame only touches the growing row",
          streamFrame.childList <= 2 && R.streamFrameBubbleRebuilds === 1,
          `childList=${streamFrame.childList} rebuilds=${R.streamFrameBubbleRebuilds}`);
        assert("untouched rows keep their DOM nodes", R.firstRowNodePreserved);
        assert("transcript still shows the streamed text", R.streamedTextVisible);
        assert("row count unchanged while streaming", R.rowsAfterStreaming === N,
          `rows=${R.rowsAfterStreaming}`);

        // ---- 3. update early in the transcript (a tool result landing) --
        // This must cost O(1) DOM work, not a shift of every later row.
        const sibling = rows()[100];
        const beforeRows = msgsEl.childElementCount;
        msgs[2] = {
          role: "Assistant",
          text: "early reply",
          reasoning: "",
          tools: [{ name: "bash", args: '{"command":"ls"}', output: "out", ms: 3 }],
          error: null,
        };
        // A replacement is a new message object (a new key), which the cursor
        // contract requires the mutator to announce.
        markDirtyAll();
        builds.n = 0;
        t = performance.now();
        const midFrame = observeOneFrame(() => renderMessages());
        R.earlyUpdateMs = +(performance.now() - t).toFixed(2);
        R.earlyUpdateChildListMutations = midFrame.childList;
        R.earlyUpdateBubbleRebuilds = builds.n;
        R.laterSiblingNodePreserved = rows()[100] === sibling;
        R.rowsAfterEarlyUpdate = msgsEl.childElementCount;
        assert("early update rebuilds exactly one row", R.earlyUpdateBubbleRebuilds === 1,
          `rebuilds=${R.earlyUpdateBubbleRebuilds}`);
        assert("early update does not shift later rows",
          R.earlyUpdateChildListMutations <= 2 && R.laterSiblingNodePreserved,
          `childList=${R.earlyUpdateChildListMutations} siblingPreserved=${R.laterSiblingNodePreserved}`);
        assert("early update keeps the row count", R.rowsAfterEarlyUpdate === beforeRows,
          `rows=${R.rowsAfterEarlyUpdate}`);

        // ---- 3b. adopting a reloaded transcript ------------------------
        // A finished turn re-reads the session and gets fresh objects for the
        // very same messages. Identity must survive for the drawn tail, or the
        // renderer rebuilds the whole window (~400 DOM mutations per turn,
        // measured by perf_selftest.sh); a message whose content changed must
        // not keep the old object, or the rewrite never appears; and pairing is
        // bounded by the drawn window, not by the session.
        const reload = msgs.map((m) => ({
          role: m.role,
          text: m.text,
          reasoning: m.reasoning,
          tools: (m.tools || []).map((t) => ({ ...t })),
          error: m.error,
        }));
        const tAdopt = performance.now();
        const adopted = reuseIdentical(msgs, reload);
        R.adoptMs = +(performance.now() - tAdopt).toFixed(2);
        R.adoptRows = adopted.length;
        R.adoptKeptTail = adopted[N - 1] === msgs[N - 1] && adopted[N - 2] === msgs[N - 2];
        R.adoptHeadFresh = adopted[0] !== msgs[0];
        assert("adopting a reload keeps the drawn tail by object", R.adoptKeptTail,
          `tailKept=${R.adoptKeptTail} rows=${R.adoptRows}`);
        // Pairing is bounded by the drawn window, so it does not grow with the
        // session. The phases above run with the window open, hence the reset.
        const copyOf = () =>
          msgs.map((m) => ({
            role: m.role,
            text: m.text,
            reasoning: m.reasoning,
            tools: (m.tools || []).map((t) => ({ ...t })),
            error: m.error,
          }));
        const savedExtra = state.windowExtra;
        state.windowExtra = 0;
        const bounded = reuseIdentical(msgs, copyOf());
        state.windowExtra = savedExtra;
        R.boundedTailKept = bounded[N - 1] === msgs[N - 1];
        R.boundedHeadFresh = bounded[0] !== msgs[0];
        assert("adopting a reload pairs the drawn window, not the session",
          R.boundedTailKept && R.boundedHeadFresh,
          `tailKept=${R.boundedTailKept} headFresh=${R.boundedHeadFresh} of ${N}`);

        // The store finalizing a reply rewrites the tail with the same length and
        // the same last characters as the draft, which is exactly what the
        // renderer's deliberately lossy signature cannot tell apart.
        const rewritten = reload.slice();
        const draft = msgs[N - 1].text;
        // Same length, same last 24 characters, different text — a collision the
        // renderer's deliberately lossy signature cannot resolve, so a row kept
        // across one would never show the rewrite.
        const collided = draft.slice(0, 8) + (draft[8] === "x" ? "y" : "x") + draft.slice(9);
        rewritten[N - 1] = { ...rewritten[N - 1], text: collided };
        assert("the rewrite probe collides with the draft's lossy signature",
          collided !== draft && collided.length === draft.length &&
            collided.slice(-24) === draft.slice(-24),
          `len=${collided.length}/${draft.length} sameTail=${
            collided.slice(-24) === draft.slice(-24)}`);
        const adoptedRewrite = reuseIdentical(msgs, rewritten);
        assert("adopting a reload does not keep a rewritten message",
          adoptedRewrite[N - 1] !== msgs[N - 1] && adoptedRewrite[N - 1].text === collided,
          `kept=${adoptedRewrite[N - 1] === msgs[N - 1]}`);
        assert(`adopting ${N} messages stays inside its budget`, R.adoptMs < 25,
          `adopt=${R.adoptMs}ms for ${N} messages`);

        // ---- 4. control: the previous wipe-and-rebuild renderer ---------
        const CTRL = 5;
        builds.n = 0;
        t = performance.now();
        for (let f = 0; f < CTRL; f++) {
          msgsEl.textContent = "";
          msgs.forEach((m, i) => {
            const row = el("div", "msg " + (m.role === "User" ? "user" : "assistant"));
            row.appendChild(buildBubble(m, false, { index: i }));
            msgsEl.appendChild(row);
          });
        }
        R.fullRebuildMsPerFrame = +((performance.now() - t) / CTRL).toFixed(1);
        R.fullRebuildBubblesPerFrame = +(builds.n / CTRL).toFixed(1);
        R.speedupVsFullRebuild = +(R.fullRebuildMsPerFrame / R.streamingRepaintMs).toFixed(0);
        buildBubble = realBubble;
        rowCache.clear();          // the control loop orphaned the cached rows
        renderMessages();

        // ---- 5. structural correctness --------------------------------
        msgs = state.cache["selftest"];
        const extra = make(N);
        msgs.push(extra);
        renderMessages();
        R.afterAppendRows = msgsEl.childElementCount;
        assert("append adds exactly one row at the tail",
          R.afterAppendRows === N + 1 && msgsEl.lastChild.textContent.includes(`${N}`),
          `rows=${R.afterAppendRows}`);

        msgs.splice(3, 1);
        renderMessages();
        R.afterDeleteRows = msgsEl.childElementCount;
        assert("delete removes exactly one row", R.afterDeleteRows === N, `rows=${R.afterDeleteRows}`);

        const swapped = msgs.slice();
        const tmp = swapped[0];
        swapped[0] = swapped[swapped.length - 1];
        swapped[swapped.length - 1] = tmp;
        state.cache["selftest"] = swapped;
        renderMessages();
        R.orderFollowsModel = msgsEl.firstChild.textContent.includes(`${N}`) &&
          msgsEl.childElementCount === swapped.length;
        assert("row order follows the message order", R.orderFollowsModel);

        // ---- 6. tool cards, diff coloring, and its safety gate ---------
        state.cache["selftest"] = [{
          role: "Assistant",
          text: "done",
          reasoning: "thinking",
          tools: [{
            name: "bash",
            args: '{"command":"git diff"}',
            output: "--- a/f.txt\n+++ b/f.txt\n@@ -1,2 +1,2 @@\n keep\n-removed\n+added",
            ms: 12,
            open: true,
          }],
          error: null,
        }];
        renderMessages();
        R.toolCards = msgsEl.querySelectorAll(".tool-card").length;
        R.diffAdds = msgsEl.querySelectorAll(".d-add").length;
        R.diffDels = msgsEl.querySelectorAll(".d-del").length;
        R.diffCtx = msgsEl.querySelectorAll(".d-ctx").length;
        assert("tool card renders", R.toolCards === 1, `cards=${R.toolCards}`);
        assert("unified diff is colored",
          R.diffAdds === 1 && R.diffDels === 1 && R.diffCtx === 3,
          `add=${R.diffAdds} del=${R.diffDels} ctx=${R.diffCtx}`);

        // Ordinary output that merely starts with +/- must stay uncolored:
        // tool output is untrusted, so heuristic coloring needs a diff header.
        state.cache["selftest"] = [{
          role: "Assistant",
          text: "",
          reasoning: "",
          tools: [{ name: "bash", args: "{}", output: "+ not a diff\n- still not", ms: 1, open: true }],
          error: null,
        }];
        renderMessages();
        R.plainOutputColored = msgsEl.querySelectorAll(".d-add, .d-del").length;
        assert("non-diff output is not colored", R.plainOutputColored === 0,
          `colored=${R.plainOutputColored}`);

        // ---- 7. empty state -------------------------------------------
        state.cache["selftest"] = [];
        renderMessages();
        R.emptyStateRows = msgsEl.childElementCount;
        assert("empty transcript shows the hint", R.emptyStateRows === 1,
          `rows=${R.emptyStateRows}`);

        // ---- 7. relative ages + sidebar navigation ---------------------
        const NOW = 1_800_000_000;
        assert("age: just now", fmtAge(NOW - 5, NOW) === "now", fmtAge(NOW - 5, NOW));
        assert("age: minutes", fmtAge(NOW - 90, NOW) === "2m", fmtAge(NOW - 90, NOW));
        assert("age: hours", fmtAge(NOW - 3 * 3600, NOW) === "3h", fmtAge(NOW - 3 * 3600, NOW));
        assert("age: days", fmtAge(NOW - 3 * 86400, NOW) === "3d", fmtAge(NOW - 3 * 86400, NOW));
        assert(
          "age: falls back to a date after a week",
          fmtAge(NOW - 30 * 86400, NOW) === fmtTime(NOW - 30 * 86400).slice(0, 5),
          fmtAge(NOW - 30 * 86400, NOW),
        );
        assert("navigation routes to a panel", typeof navTo === "function");
        // The sidebar no longer lists these surfaces (rev 110), so the palette is
        // the path that must not rot: `/files` has to name the Settings section
        // that owns the tree. The section gesture itself is check 40 below.
        const filesCmd = BUILTIN_COMMANDS.find((c) => c.name === "/files");
        assert(
          `the palette still reaches the files browser (${filesCmd ? filesCmd.hint : "missing"})`,
          !!filesCmd && /files-section/.test(String(filesCmd.run)),
        );

        // ---- 8. sessions group by workspace -----------------------------
        const preGroups = groupSessions(
          [
            { id: "a", title: "a", workspace: "w1" },
            { id: "b", title: "b", workspace: "w2" },
            { id: "c", title: "c", workspace: "" },
          ],
          [
            { id: "w1", name: "bos", root: "/p/bos", model: "m1" },
            { id: "w2", name: "notes", root: "/notes", model: "" },
          ],
          "w1",
          { group: "tree", order: "updated", filter: "hide" },
        );
        assert(
          "a session with no workspace joins the active one",
          preGroups.length === 2 && preGroups[0].sessions.length === 2,
          `groups=${preGroups.length} first=${(preGroups[0] || {}).sessions?.length}`,
        );
        assert(
          "a group carries the name, root and bound model",
          preGroups[0].name === "bos" && preGroups[0].root === "/p/bos" && preGroups[0].model === "m1",
          JSON.stringify({ n: preGroups[0].name, r: preGroups[0].root, m: preGroups[0].model }),
        );
        assert(
          "an unknown workspace still lists its chats",
          groupSessions([{ id: "d", title: "d", workspace: "gone" }], [], "w1", { group: "tree", order: "updated", filter: "hide" })[0].name === "gone",
        );

        // ---- 9. workspace management in the panel -----------------------
        renderSidebar();
        // The Add-workspace dialog is the section header's folder-plus and
        // nothing else: a second row under the list was removed on request, and
        // this is the check that keeps it removed (the control itself is the
        // header's, so a fixture that only looked for a row could not see it).
        assert(
          "the sidebar draws no add row of its own — the header's folder-plus is the door",
          !sessionList.querySelector(".ws-add") && !!document.getElementById("workspace-add-primary"),
          `rows=${sessionList.querySelectorAll(".ws-add").length} header=${!!document.getElementById("workspace-add-primary")}`,
        );
        openWorkspaceForm("create", "");
        assert(
          "the inline form is still the row that appears for a rename/edit",
          !!document.querySelector(".ws-form") && !document.querySelector(".ws-add"),
        );
        assert(
          "the create form asks for a name and a root",
          !!document.querySelector(".ws-form .ws-name") &&
            !!document.querySelector(".ws-form .ws-root"),
        );
        state.workspaces = [{ id: "w1", name: "bos", root: "/p/bos", model: "m1" }];
        openWorkspaceForm("edit", "w1");
        const editName = document.querySelector(".ws-form .ws-name");
        assert(
          "the edit form is prefilled from the workspace",
          !!editName && editName.value === "bos",
          editName ? `name=${editName.value}` : "no field",
        );
        openWorkspaceForm("remove", "w1");

        // same loop with the window open — same frames, same mutation, one flag.
        const frames = 120;

        // which slides the window by one and must therefore drop a row and sign a

          const arr = [];
          for (let i = 0; i < N; i++) arr.push(make(i));
          state.cache["selftest"] = arr;
          state.activeId = "selftest";
          state.windowExtra = extra;
          markDirtyAll();
          renderMessages();
          // Rows, not children: the scroller also holds the spacer that stands
          // in for the rows above the window, and counting that as a row made
          // this phase fail the moment the spacer was added.
          const rows = rowCache.size;
          const t0 = performance.now();
          for (let f = 0; f < frames; f++) {
            if (append) arr.push(make(N + f));
            else arr[arr.length - 1].text = `tail ${f} ${"x".repeat(f % 40)}`;
            markDirty(arr.length - 1);
            renderMessages();
          }
          return { ms: +((performance.now() - t0) / frames).toFixed(3), rows };
        };
        const windowed = streamCost(0);
        R.windowedStreamMsPerFrame = windowed.ms;
        R.windowedRows = windowed.rows;
        const unwindowed = streamCost(N);
        R.unwindowedStreamMsPerFrame = unwindowed.ms;
        const appendWindowed = streamCost(0, true);
        const appendUnwindowed = streamCost(N, true);
        R.appendWindowedMsPerFrame = appendWindowed.ms;

          appendWindowed.rows === Math.min(N, 200) &&
            appendWindowed.ms <= appendUnwindowed.ms * 1.25 + 0.05,
        );
        R.windowedSpeedup = +(unwindowed.ms / (windowed.ms || 0.001)).toFixed(1);

          windowed.rows === Math.min(N, 200),

          `streaming at the cap is bounded by the window (N=${N} windowed=${windowed.ms}ms unwindowed=${unwindowed.ms}ms speedup=${R.windowedSpeedup}x)`,

          // the shipped layout makes it one, so the fixture does too.
          const priorHeight = msgsEl.style.height;
          const priorOverflow = msgsEl.style.overflowY;
          msgsEl.style.height = "400px";
          msgsEl.style.overflowY = "auto";
          markDirtyAll();
          renderMessages();
          const spacer0 = msgsEl.querySelector(".spacer-top");
          const h0 = spacer0 ? parseFloat(spacer0.style.height) || 0 : 0;
          const rows0 = rowCache.size;
          const scrollH = msgsEl.scrollHeight;
          const before = lastWindowStart;

          // Scrolling to the top asks for the older rows. `followTail` is a
          // module-level binding in the shipped script, so the harness can put
          // the reader in the state a scroll-up produces: not following the tail.
          followTail = false;
          msgsEl.scrollTop = 0;
          msgsEl.dispatchEvent(new Event("scroll"));
          const extraMid = state.windowExtra;
          renderMessages();
          const spacer1 = msgsEl.querySelector(".spacer-top");
          const h1 = spacer1 ? parseFloat(spacer1.style.height) || 0 : 0;
          const rows1 = rowCache.size;
          // Read the offset now: a later render would have moved it again.
          const moved = msgsEl.scrollTop;
          R.windowScroll = `rows=${rows0}->${rows1} spacer=${h0}->${h1} gave=${
            h0 - h1
          } moved=${Math.round(moved)} extra=${extraMid} client=${msgsEl.clientHeight}`;

          assert(
            `a long chat draws only the tail before the scroll (rows0=${rows0} before=${before})`,
            rows0 === 200 && before === growN - 200,
          );
          assert(
            `a spacer stands in for the rows above the window (top=${h0} scrollHeight=${scrollH})`,
            h0 > 0 && scrollH > 0,
          );
          assert(
            `scrolling to the top asks for one more window (rows=${rows0}->${rows1} extra=${extraMid})`,
            rows1 === 400 && h1 > 0 && h1 < h0 && extraMid === 200,
          );
          assert(
            `growing the window does not move the reader (gave=${h0 - h1} moved=${Math.round(
              moved,
            )})`,
            Math.abs(moved - (h0 - h1)) <= 1,
          );

          // A gesture fires dozens of scroll events in one frame; each used to
          // add its own window, so one flick grew the drawn transcript by the
          // whole burst and the window cap held only until the first scroll-up.
          state.windowExtra = 0;
          followTail = false;
          msgsEl.scrollTop = 0;
          markDirtyAll();
          renderMessages();
          for (let i = 0; i < 50; i++) msgsEl.dispatchEvent(new Event("scroll"));
          const burstExtra = state.windowExtra;
          renderMessages();
          assert(
            `a burst of scroll events grows the window once (events=50 extra=${burstExtra} rows=${rowCache.size})`,
            burstExtra === 200,
          );

          // ---- 38. the spacer goes away when the whole chat is drawn -----
          state.windowExtra = growN;
          markDirtyAll();
          renderMessages();
          const spacerGone = msgsEl.querySelector(".spacer-top");
          assert(
            `the spacer disappears once the window covers the whole chat (present=${!!spacerGone})`,
            !spacerGone && rowCache.size === growN,
          );

          msgsEl.style.height = priorHeight;
          msgsEl.style.overflowY = priorOverflow;
          state.windowExtra = N;
          markDirtyAll();
          renderMessages();
        }

        // ---- 39. the file sidebar flattens exactly what was listed ------
        // fileRowsFrom carries the whole drawing rule: only folders the user
        // opened are descended into, backend order is kept, and a folder
        // that refused to open becomes a row that explains itself.
        const treeFixture = {
          "": {
            status: "ok",
            entries: [
              { path: "crates", name: "crates", is_dir: true, bytes: 0 },
              { path: "README.md", name: "README.md", is_dir: false, bytes: 20480 },
            ],
          },
          crates: {
            status: "ok",
            entries: [
              { path: "crates/gui", name: "gui", is_dir: true, bytes: 0 },
              { path: "crates/agent.rs", name: "agent.rs", is_dir: false, bytes: 512 },
            ],
          },
          "crates/gui": { status: "error", error: "not readable: nope", entries: [] },
        };
        const flat = fileRowsFrom(treeFixture);
        assert(
          `children follow their folder, depth first (paths=${flat.map((r) => r.path).join("|")})`,
          flat.length === 4 &&
            flat.map((r) => r.path).join("|") === "crates|crates/gui|crates/agent.rs|README.md",
        );
        assert(
          `depth follows nesting (depths=${flat.map((r) => r.depth).join(",")})`,
          flat.map((r) => r.depth).join(",") === "0,1,1,0",
        );
        assert(
          `a folder that refused to open carries the reason on its row (state=${flat[1].state} error=${flat[1].error})`,
          flat[1].state === "error" &&
            flat[1].name === "gui" &&
            flat[1].error === "not readable: nope",
        );
        assert(
          `a file never expands and keeps its size (bytes=${flat[2].bytes} state=${flat[2].state})`,
          !flat[2].isDir && flat[2].state === "file" && flat[2].bytes === 512,
        );
        const collapsed = fileRowsFrom({ "": treeFixture[""] });
        assert(
          `collapsing a folder removes its children (rows=${collapsed.length})`,
          collapsed.length === 2,
        );
        const pending = fileRowsFrom({
          "": treeFixture[""],
          crates: { status: "loading", entries: [] },
        });
        assert(
          `a folder still loading shows itself and nothing under it (rows=${pending.length} state=${pending[0].state})`,
          pending.length === 2 && pending[0].state === "loading",
        );
        const noRoot = fileRowsFrom({
          "": { status: "error", error: "no workspace configured", entries: [] },
        });
        assert(
          `an unusable workspace root is a row that says so (rows=${noRoot.length} error=${noRoot[0] && noRoot[0].error})`,
          noRoot.length === 1 &&
            noRoot[0].state === "error" &&
            noRoot[0].error === "no workspace configured",
        );
        assert(
          `sizes read human (512=${formatFileBytes(512)} 20480=${formatFileBytes(
            20480,
          )} 3M=${formatFileBytes(3 * 1024 * 1024)})`,
          formatFileBytes(512) === "512 B" &&
            formatFileBytes(20480) === "20.0 kB" &&
            formatFileBytes(3 * 1024 * 1024) === "3.0 MB",
        );

        // ---- 40. the Files section loads on the way in, once -------------
        // The harness's invoke never settles, so the first paint is the loading
        // row: enough to prove selecting the section drives the fetch. The
        // second selection must not ask again — a cache that is refetched on
        // every visit is the same work as no cache, and the section is selected
        // by clicking a rail tab, so that click is what this drives.
        const treeHost = $("file-tree");
        const filesCalls = [];
        window.__TAURI__.core.invoke = (cmd) => {
          filesCalls.push(cmd);
          return new Promise(() => {});
        };
        const filesTab = document.querySelector('.set-tab[data-section="files-section"]');
        const filesPane = $("files-section");
        const listCalls = () => filesCalls.filter((c) => c === "list_files").length;
        filesTab.click();
        assert(
          `selecting Files asks for the root once and paints its loading row (pane=${
            filesPane.classList.contains("active")
          } rows=${treeHost.querySelectorAll(".file-row").length} calls=${listCalls()})`,
          filesPane.classList.contains("active") &&
            treeHost.querySelectorAll(".file-row").length === 1 &&
            listCalls() === 1,
        );
        filesTab.click();
        assert(
          `selecting it again re-uses the cache (calls=${listCalls()})`,
          listCalls() === 1 && filesPane.classList.contains("active"),
        );

        // ---- 41. the run panel keeps bounded, honest, plain-text output --
        // Pure bits first: the cap keeps the newest lines, and the footer is
        // the whole receipt — exit code, line count, seconds, and the two
        // things that must never be swallowed: a budget cut, and the reason.
        const capKept = trimRunLines([{ i: 1 }, { i: 2 }, { i: 3 }], 2);
        assert(
          "run lines are capped to the newest N",
          capKept.length === 2 && capKept[0].i === 2 && capKept[1].i === 3,
        );
        const cleanFooter = formatRunFooter({
          exit_code: 0,
          lines: 3,
          duration_ms: 1234,
          truncated: false,
          error: null,
        });
        assert(
          `a clean run's footer reads exit 0 (${cleanFooter})`,
          cleanFooter === "[exit 0 · 3 lines · 1.2s]",
        );
        const refusedFooter = formatRunFooter({
          exit_code: null,
          lines: 0,
          duration_ms: 0,
          truncated: true,
          error: "could not start: nope",
        });
        assert(
          `a refused run and a budget cut both say so (${refusedFooter})`,
          refusedFooter ===
            "[stopped · 0 lines · 0.0s · stopped by the budget · could not start: nope]",
        );

        // The panel follows open state in both directions...
        const runPanel = $("run-panel");
        const runOut = $("run-output");
        const savedRunPanel = JSON.parse(JSON.stringify(state.runPanel));
        toggleRunPanel();
        assert(
          `the run panel opens on demand (open=${state.runPanel.open} hidden=${runPanel.hidden})`,
          state.runPanel.open === true && runPanel.hidden === false,
        );
        toggleRunPanel();
        assert(
          `the run panel closes again (open=${state.runPanel.open} hidden=${runPanel.hidden})`,
          state.runPanel.open === false && runPanel.hidden === true,
        );
        toggleRunPanel();
        assert(
          `...and reopens (open=${state.runPanel.open} hidden=${runPanel.hidden})`,
          state.runPanel.open === true && runPanel.hidden === false,
        );

        // ...and repaints kept lines as labelled text: stderr marked, an
        // angle-bracket payload rendered literally, never parsed as HTML.
        state.runPanel.lines = [];
        pushRunLine("stdout", "hello");
        pushRunLine("stderr", "<b>not html</b>");
        pushRunLine("note", "[exit 0 · 2 lines · 0.1s]");
        renderRunPanel();
        assert(
          "output renders as three labelled text lines (no HTML sink)",
          runOut.querySelectorAll(".run-line.err").length === 1 &&
            runOut.querySelector(".run-line.err").textContent ===
              "<b>not html</b>" &&
            runOut.querySelector("b") === null &&
            runOut.textContent.includes("hello") &&
            runOut.textContent.includes("[exit 0 · 2 lines · 0.1s]"),
        );

        setRunChip(true);
        assert(
          `the chip announces a run in flight (text=${$("run-chip").textContent} class=${$(
            "run-chip",
          ).className})`,
          $("run-chip").textContent === "running" &&
            $("run-chip").className === "chip streaming",
        );
        setRunChip(false);
        assert(
          `the chip falls back to idle (${$("run-chip").textContent} / ${$("run-chip").className})`,
          $("run-chip").textContent === "idle" && $("run-chip").className === "chip idle",
        );
        assert(
          "the palette carries /run",
          BUILTIN_COMMANDS.some((c) => c.name === "/run"),
        );

        // A reload should bring the panel back as it was: open stays open,
        // lines come with it. The blob gained an open flag, and the bare
        // array it used to be must still load — pure parser, pinned here.
        const blobArray = parseRunBlob([{ stream: "stdout", text: "hi" }]);
        assert(
          "the old bare-array blob still loads, closed",
          blobArray.open === false &&
            blobArray.lines.length === 1 &&
            blobArray.lines[0].text === "hi",
        );
        const blobOpen = parseRunBlob({
          open: true,
          lines: [{ stream: "stderr", text: "e" }],
        });
        assert(
          "an open panel comes back open after a reload",
          blobOpen.open === true && blobOpen.lines.length === 1,
        );
        const blobJunk = parseRunBlob({ nope: 1 });
        assert(
          "a malformed blob degrades to an empty, closed panel",
          blobJunk.open === false && blobJunk.lines.length === 0,
        );

        // The blob gained a mode after the open flag; the two older shapes
        // still load, and a mode that is not exactly "term" is run mode.
        const blobTerm = parseRunBlob({ open: true, mode: "term", lines: [] });
        assert(
          "a term-mode panel comes back in term mode",
          blobTerm.open === true && blobTerm.mode === "term",
        );
        const blobBadMode = parseRunBlob({ open: true, mode: "TUI?", lines: [] });
        assert(
          "a garbage mode degrades to run mode, never a crash",
          blobBadMode.mode === "run",
        );
        assert(
          "the old bare-array blob still loads as run mode",
          parseRunBlob([{ stream: "stdout", text: "hi" }]).mode === "run",
        );
        assert(
          "the palette carries /term next to /run",
          BUILTIN_COMMANDS.some((c) => c.name === "/term"),
        );

        // Term chunks may split a line mid-way; the panel holds the tail
        // until the newline lands, then emits whole lines only.
        state.runPanel.partial = "";
        state.runPanel.lines = [];
        pushTermChunk("abc");
        const heldWhole = state.runPanel.lines.length === 0 && state.runPanel.partial === "abc";
        pushTermChunk("def\nnext");
        assert(
          "a split line is held, then flushed whole",
          heldWhole &&
            state.runPanel.lines.length === 1 &&
            state.runPanel.lines[0].text === "abcdef" &&
            state.runPanel.partial === "next",
        );

        // The note and the chip speak the mode: a terminal must say so.
        setRunMode("term");
        const termNoteOk =
          $("run-note").textContent.includes("interactive shell") &&
          $("run-panel").classList.contains("term");
        setRunMode("run");
        assert(
          "the honesty note swaps with the mode (term ↔ run)",
          termNoteOk &&
            $("run-note").textContent.includes("plain text") &&
            !$("run-panel").classList.contains("term"),
        );
        setRunChip(true, "attached");
        assert(
          `the chip can announce an attached session (${$("run-chip").textContent})`,
          $("run-chip").textContent === "attached" &&
            $("run-chip").className === "chip streaming",
        );
        setRunChip(false, "exit 7");
        assert(
          "the chip can announce a dead session with its code",
          $("run-chip").textContent === "exit 7" &&
            $("run-chip").className === "chip idle",
        );

        state.runPanel = savedRunPanel;
        setRunMode(savedRunPanel.mode || "run");
        renderRunPanel();

        // The Memory pane's status line is where an implied isolation would show
        // up, so its branches are pinned as text here rather than through a bridge.
        const memLine = (status, kept) => memoryStatusLine(status, kept);
        assert(
          "the memory status names the file, the sharing and the cap",
          memLine({ enabled: true, path: "/home/u/.bos/gui/memory.jsonl", shared_workspaces: 2, cap: 500 }, 2) ===
            "/home/u/.bos/gui/memory.jsonl · shared by 2 workspaces · 2 of 500 kept",
          memLine({ enabled: true, path: "p", shared_workspaces: 2, cap: 500 }, 2),
        );
        assert(
          "a store only one workspace uses says so instead of implying sharing",
          memLine({ enabled: true, path: "p", shared_workspaces: 1, cap: 500 }, 1).includes(
            "its own file",
          ) && !memLine({ enabled: true, path: "p", shared_workspaces: 1, cap: 500 }, 1).includes("shared by"),
          memLine({ enabled: true, path: "p", shared_workspaces: 1, cap: 500 }, 1),
        );
        assert(
          "the status warns only when the store is actually at its cap",
          memLine({ enabled: true, path: "p", shared_workspaces: 1, cap: 3 }, 3).includes("at the cap") &&
            !memLine({ enabled: true, path: "p", shared_workspaces: 1, cap: 3 }, 2).includes("at the cap"),
          memLine({ enabled: true, path: "p", shared_workspaces: 1, cap: 3 }, 3),
        );
        assert(
          "a switched-off store says switched off, not that nothing is remembered",
          memLine({ enabled: false, path: "", shared_workspaces: 1, cap: 500 }, 0) ===
            "Memory is switched off for this workspace.",
          memLine({ enabled: false, path: "", shared_workspaces: 1, cap: 500 }, 0),
        );

        // ---- 20. a reminder reads as a line -------------------------------
        // How often, when next, and how often it has run — the three facts the
        // Schedule pane exists to show, in the fewest words that stay exact.
        assert(
          "a cadence reads as the interval it is",
          cadenceText({ kind: "every", every_minutes: 1 }) === "every minute" &&
            cadenceText({ kind: "every", every_minutes: 5 }) === "every 5 min" &&
            cadenceText({ kind: "once", at_ms: 5 }) === "once" &&
            cadenceText(null) === "",
          [1, 5].map((m) => cadenceText({ kind: "every", every_minutes: m })).join(" / "),
        );
        assert(
          "a due time is described from the caller's clock, and a past one is due",
          untilText(60000, 0) === "in 1 min" &&
            untilText(0, 0) === "due now" &&
            untilText(-60000, 0) === "due now" &&
            untilText(3600000, 0) === "in 1 h" &&
            untilText(3 * 86400000, 0) === "in 3 d",
          [60000, 0, -60000, 3600000, 3 * 86400000].map((d) => untilText(d, 0)).join(" / "),
        );
        assert(
          "a reminder line names what, how often, when next, and how often it ran",
          scheduleLine(
            {
              id: "s1",
              text: "water the plants",
              cadence: { kind: "every", every_minutes: 5, next_ms: 300000 },
              fired: 2,
            },
            0,
          ) === "water the plants · every 5 min · in 5 min · delivered 2×",
          scheduleLine(
            {
              id: "s1",
              text: "water the plants",
              cadence: { kind: "every", every_minutes: 5, next_ms: 300000 },
              fired: 2,
            },
            0,
          ),
        );
        // The due time inside a cadence differs by kind, and reading the wrong
        // field is exactly how a one-shot would render as "due now" forever.
        assert(
          "a cadence's next due is read by kind",
          scheduleDue({ kind: "once", at_ms: 11 }) === 11 &&
            scheduleDue({ kind: "every", every_minutes: 5, next_ms: 22 }) === 22 &&
            scheduleDue(null) === 0,
          `${scheduleDue({ kind: "once", at_ms: 11 })}/${scheduleDue({
            kind: "every",
            every_minutes: 5,
            next_ms: 22,
          })}`,
        );
        assert(
          "a delivery says how late it was only when a tick was late for it",
          !/late/.test(deliveryLine({ text: "x", at_ms: 1000, noticed_ms: 1000 })) &&
            !/late/.test(deliveryLine({ text: "x", at_ms: 1000, noticed_ms: 30000 })) &&
            /1 min late/.test(deliveryLine({ text: "x", at_ms: 1000, noticed_ms: 61000 })) &&
            /^x · /.test(deliveryLine({ text: "x", at_ms: 1000, noticed_ms: 1000 })),
          `${deliveryLine({ text: "x", at_ms: 1000, noticed_ms: 30000 })} | ${deliveryLine({
            text: "x",
            at_ms: 1000,
            noticed_ms: 61000,
          })}`,
        );
        assert(
          "the bounds line states every cap in force, and names the one at hand",
          scheduleCapsLine({
            schedules: [{ id: "a" }, { id: "b" }],
            history: [{}, {}],
            caps: { min_every_minutes: 1, max_schedules: 50, max_history: 200, max_text_chars: 500 },
          }) ===
            "2 of 50 reminders · 2 of 200 deliveries kept · a repeat needs at least 1 min" &&

                schedules: [{}, {}],
                history: [],
                caps: {
                  min_every_minutes: 1,
                  max_schedules: 2,
                  max_history: 200,
                  max_text_chars: 500,
                },
              }),
            ) &&
            scheduleCapsLine(null) === "",
          scheduleCapsLine({
            schedules: [{}, {}],
            history: [],
            caps: { min_every_minutes: 1, max_schedules: 2, max_history: 200, max_text_chars: 500 },
          }),
        );

        // ---- 21. a knowledge note reads as a card -------------------------
        // When it was last edited, the first line of the body, and the bounds
        // in force. A future timestamp (a clock that moved backwards) must read
        // as "just now" rather than as a negative age.
        assert(
          "an edit time is described from the caller's clock, and a future one is now",
          sinceText(1000, 1000) === "just now" &&
            sinceText(1000, 61000) === "1 min ago" &&
            sinceText(1000, 1000 + 59 * 60000) === "59 min ago" &&
            sinceText(1000, 1000 + 3600000) === "1 h ago" &&
            sinceText(1000, 1000 + 47 * 3600000) === "47 h ago" &&
            sinceText(1000, 1000 + 48 * 3600000) === "2 d ago" &&
            sinceText(1000, 1) === "just now" &&
            sinceText(undefined, 1) === "just now",
          [0, 60000, 3540000, 3600000, 47 * 3600000, 48 * 3600000]
            .map((d) => sinceText(1000, 1000 + d))
            .join(" / "),
        );
        assert(
          "a body preview is one line, and says when it was cut",
          kbBodyPreview("first line\n\n  second   line ") === "first line second line" &&
            kbBodyPreview("") === "" &&
            kbBodyPreview(null) === "" &&
            kbBodyPreview("x".repeat(200)) === "x".repeat(200) &&
            kbBodyPreview("x".repeat(201)) === `${"x".repeat(199)}…`,
          kbBodyPreview("x".repeat(201)).length,
        );
        assert(
          "the knowledge bounds line states every cap, including the search cap it lowers",
          kbCapsLine({
            total: 3,
            caps: {
              max_entries: 500,
              max_title_chars: 120,
              max_body_chars: 4000,
              tool_max_limit: 20,
            },
          }) ===

                total: 500,
                caps: {
                  max_entries: 500,
                  max_title_chars: 120,
                  max_body_chars: 4000,
                  tool_max_limit: 20,
                },
              }),
            ) &&
            /search returns 5 at most/.test(
              kbCapsLine({
                total: 0,
                caps: {
                  max_entries: 500,
                  max_title_chars: 120,
                  max_body_chars: 4000,
                  tool_max_limit: 5,
                },
              }),
            ) &&
            kbCapsLine(null) === "" &&
            kbCapsLine({}) === "",
          kbCapsLine({
            total: 3,
            caps: {
              max_entries: 500,
              max_title_chars: 120,
              max_body_chars: 4000,
              tool_max_limit: 20,
            },
          }),
        );

        // ---- 22. the MCP policy reads as a decision -----------------------
        // A tool's line names the rule that decided it, a server's line says
        // how many of its tools survived, and the summary carries the counts and
        // the default — including the one case where the file is not the
        // version this build writes.
        assert(
          "an effect has one spelling, and an unruled tool says so",
          effectLabel("allow") === "Allow" &&
            effectLabel("ask") === "Ask" &&
            effectLabel("deny") === "Deny" &&
            policyReason("default") === "follows the default" &&
            policyReason(undefined) === "follows the default" &&
            policyReason("filesystem/*") === "by rule filesystem/*",
          [effectLabel("ask"), policyReason("srv/read")].join(" / "),
        );
        assert(
          "the policy summary counts attached, denied, asked and the default",
          policyLine({
            attached: 2,
            denied: 1,
            asked: 1,
            default: "allow",
            rules: [{}, {}],
            max_rules: 200,
            servers: [{ tools: [{}, {}] }, { tools: [{}] }],
            file_version: 1,
            expected_version: 1,
          }) === "2 of 3 tools attached · 1 denied · 1 ask · 2 of 200 rules · default allow" &&
            policyLine(null) === "" &&
            /version 9, this build writes 1/.test(
              policyLine({
                attached: 0,
                denied: 0,
                asked: 0,
                default: "deny",
                rules: [],
                max_rules: 200,
                servers: [],
                file_version: 9,
                expected_version: 1,
              }),
            ),
          policyLine({
            attached: 2,
            denied: 1,
            asked: 1,
            default: "allow",
            rules: [{}, {}],
            max_rules: 200,
            servers: [{ tools: [{}, {}] }, { tools: [{}] }],
            file_version: 1,
            expected_version: 1,
          }),
        );
        assert(
          "a server with nothing denied counts tools, not survivors",
          serverToolLine({ attached: 1, denied: 0, tools: [{}] }) === "1 tool" &&
            serverToolLine({ attached: 3, denied: 0, tools: [{}, {}, {}] }) === "3 tools" &&
            serverToolLine({ attached: 2, denied: 1, tools: [{}, {}, {}] }) ===
              "2 of 3 tools · 1 denied",
          serverToolLine({ attached: 2, denied: 1, tools: [{}, {}, {}] }),
        );

        // ---- 23. a skill row counts what the agent receives ----------------
        // The pane's number and the loader's number are the same by
        // construction, so this line is the one place a formatting drift would
        // show: chars of instruction, where the file is, and whether this
        // workspace has switched it off.
        assert(
          "a skill row names its instructions, its file and its workspace state",
          skillLine({
            name: "code-review",
            instructions_chars: 34,
            path: "/skills/code-review/SKILL.md",
            denied: false,
          }) === "34 chars of instruction · /skills/code-review/SKILL.md" &&
            skillLine({
              name: "release-notes",
              instructions_chars: 12,
              path: "/skills/release-notes/SKILL.md",
              denied: true,
            }) === "12 chars of instruction · off for this workspace · /skills/release-notes/SKILL.md",
          skillLine({ name: "x", instructions_chars: 0, path: "p", denied: false }),
        );
        assert(
          "the skills summary counts them, says how many are off, and names the directory",
          skillCapsLine({
            dir: "/skills",
            exists: true,
            skills: [{ denied: false }, { denied: true }],
            max_body_chars: 12000,
          }) === "2 skills · 1 off for this workspace · /skills · bodies up to 12000 chars" &&
            skillCapsLine({
              dir: "/skills",
              exists: true,
              skills: [{ denied: false }],
              max_body_chars: 12000,
            }) === "1 skill · /skills · bodies up to 12000 chars" &&
            skillCapsLine({ dir: "/gone", exists: false, skills: [], max_body_chars: 12000 }) ===
              "0 skills · /gone (missing — saving creates it) · bodies up to 12000 chars",
          skillCapsLine({ dir: "/skills", exists: true, skills: [], max_body_chars: 12000 }),
        );

        // ---- 24. an MCP catalog reads as what a server publishes -----------
        // A server's line says how many of each it offers — or that it never
        // declared the capability, which is a different sentence from "none".
        assert(
          "a server line counts what it published, or says the capability is absent",
          catalogServerLine({ connected: true, resources_supported: true, resources_total: 2, prompts_supported: true, prompts_total: 1 }) ===
            "2 resources · 1 prompt" &&
            catalogServerLine({ connected: true, resources_supported: true, resources_total: 1, prompts_supported: false, prompts_total: 0 }) ===
              "1 resource · no prompts capability" &&
            catalogServerLine({ connected: true, resources_supported: false, prompts_supported: false }) ===
              "no resources capability · no prompts capability" &&
            catalogServerLine({ connected: false }) === "not connected this pass",
          catalogServerLine({ connected: true, resources_supported: true, resources_total: 2, prompts_supported: false }),
        );
        assert(
          "a resource row names its type, and says when the name was cut",
          catalogRowLine({ name: "schema", mime_type: "application/json", clipped: false }) ===
            "application/json" &&
            catalogRowLine({ name: "x", mime_type: null, clipped: true }) === "clipped" &&
            catalogRowLine({ name: "x" }) === "",
          catalogRowLine({ mime_type: "text/markdown", clipped: false }),
        );
        assert(
          "a prompt row counts its arguments and the required ones",
          promptRowLine({ arguments: 0, required: 0 }) === "no arguments" &&
            promptRowLine({ arguments: 1, required: 0 }) === "1 argument" &&
            promptRowLine({ arguments: 3, required: 2 }) === "3 arguments · 2 required" &&
            promptRowLine({ arguments: undefined, required: undefined }) === "no arguments",
          promptRowLine({ arguments: 3, required: 2 }),
        );
        assert(
          "a read line reports the size it sent and whether it was cut",
          readLine({ server: "srv", uri: "file:///a", chars: 12, source_chars: 12, mime_type: "text/plain", parts: 1, truncated: false, empty: false }) ===
            "srv/file:///a · 12 chars · text/plain" &&
            readLine({ server: "srv", uri: "file:///big", chars: 20000, source_chars: 41000, mime_type: null, parts: 2, truncated: true, empty: false }) ===
              "srv/file:///big · 20000 of 41000 chars · 2 parts · truncated" &&
            readLine({ server: "srv", uri: "file:///blob.png", chars: 0, source_chars: 0, mime_type: "image/png", parts: 1, truncated: false, empty: true }) ===
              "srv/file:///blob.png · no text (image/png)",
          readLine({ server: "s", uri: "u", chars: 1, source_chars: 2, truncated: true, empty: false }),
        );

        // ---- 25. a chat's own skills read as a scope -----------------------
        // "This chat carries nothing" and "nobody has read this chat yet" are
        // different states, and a report that belongs to another chat is the
        // second one: guessing from it would print the wrong chat's answer.
        assert(
          "a chat's skills read as a scope, and an unread one is not guessed",
          skillScopeLine(null, "") === "Open a chat to switch a skill on for it." &&
            skillScopeLine(null, "chat-1") === "Reading this chat's skills…" &&
            skillScopeLine({ session: "other", explicit: false }, "chat-1") ===
              "Reading this chat's skills…" &&
            skillScopeLine(
              { session: "chat-1", explicit: false, active: ["a", "b"], available: ["a", "b", "c"] },
              "chat-1",
            ) === "This chat follows the workspace · 2 of 3 skills" &&
            skillScopeLine(
              { session: "chat-1", explicit: true, active: [], available: ["a", "b"] },
              "chat-1",
            ) === "This chat carries its own list · 0 of 2 skills" &&
            skillScopeLine({ session: "chat-1", explicit: true, active: ["a"] }, "chat-1") ===
              "This chat carries its own list · 1 of 0 skills",
          skillScopeLine({ session: "chat-1", explicit: true, active: [] }, "chat-1"),
        );

        /* 26. the sidebar's row menus, as values. The rendered menu is the page
           guard's business; what is asserted here is the model behind it — the
           order the reference uses, the labels that flip with the chat's own
           state, and the sort that keeps a pin inside its own workspace. */
        const plain = { id: "a", title: "a", pinned: false, archived: false, updated_at: 10 };
        const pinned = { id: "b", title: "b", pinned: true, archived: false, updated_at: 20 };
        const filed = { id: "c", title: "c", pinned: false, archived: true, updated_at: 30 };
        const runs = sessionMenu(plain).map((i) => i.run);
        const labels = sessionMenu(plain).map((i) => i.label);
        const keys = sessionMenu(plain).map((i) => i.accel || "");
        R.checks["26a the chat menu is the reference's five entries in its order"] =
          runs.join(",") === "pin,rename,fork,archive,delete" ? "PASS" : `FAIL (${runs})`;
        R.checks["26b only Delete is destructive, and every entry is named"] =
          sessionMenu(plain).filter((i) => i.danger).map((i) => i.run).join(",") === "delete" &&
          labels.every((l) => l.length > 4)
            ? "PASS"
            : `FAIL (${labels})`;
        R.checks["26c a pinned chat offers to unpin, not to pin again"] =
          sessionMenu(pinned)[0].label.includes("Unpin") ? "PASS" : `FAIL (${labels})`;
        R.checks["26d an archived chat offers Restore, and the key hint goes away"] =
          sessionMenu(filed)[3].label.includes("Restore") && sessionMenu(filed)[3].accel === ""
            ? "PASS"
            : `FAIL (${sessionMenu(filed)[3].label}/${sessionMenu(filed)[3].accel})`;
        R.checks["26e the accelerators name both platforms this app answers"] =
          keys[0] === "" && keys[1] === "Cmd/Ctrl+G" && keys[2] === "Cmd/Ctrl+F" && keys[3] === "Cmd/Ctrl+Shift+A"
            ? "PASS"
            : `FAIL (${keys})`;
        const wsRuns = workspaceMenu({ id: "w", name: "bos" }).map((i) => i.run);
        R.checks["26f the workspace menu starts a chat and keeps rename/delete"] =
          wsRuns.join(",") === "new,rename,delete" ? "PASS" : `FAIL (${wsRuns})`;
        // 26g is the interesting one: the pin must order chats *within* a
        // workspace, which a flat sort cannot express.
        const emptyWorkspaceGroups = groupSessions(
        [{ id: "s1", title: "in w1", workspace: "w1", updated_at: 1, pinned: false, archived: false }],
        [{ id: "w1", name: "bos" }, { id: "w9", name: "just added" }],
        "w1",
        { group: "tree", order: "updated", filter: "hide" },
      );
      assert(
        `a workspace with no chats is still a group ("${emptyWorkspaceGroups.map((g) => g.name + ":" + g.sessions.length).join(",")}")`,
        emptyWorkspaceGroups.length === 2 &&
          emptyWorkspaceGroups[1].name === "just added" &&
          emptyWorkspaceGroups[1].sessions.length === 0,
      );
      const pinGroups = groupSessions(
          [
            { id: "1", workspace: "w1", pinned: false, updated_at: 50 },
            { id: "2", workspace: "w1", pinned: true, updated_at: 10 },
            { id: "3", workspace: "w2", pinned: false, updated_at: 99 },
            { id: "4", workspace: "w1", pinned: false, updated_at: 1, archived: true },
          ],
          [
            { id: "w1", name: "one" },
            { id: "w2", name: "two" },
          ],
          "w1",
          { group: "tree", order: "updated", filter: "hide" },
        );
        R.checks["26g a pin orders its own workspace, not the whole sidebar"] =
          pinGroups.length === 2 &&
          pinGroups[0].sessions.map((s) => s.id).join(",") === "2,1" &&
          pinGroups[1].sessions.map((s) => s.id).join(",") === "3"
            ? "PASS"
            : `FAIL (${pinGroups.map((g) => g.sessions.map((s) => s.id).join("+")).join(" / ")})`;
        R.checks["26h an archived chat is in no group, and is listed as archived"] =
          pinGroups.every((g) => !g.sessions.some((s) => s.id === "4")) &&
          archivedSessions([
            { id: "4", archived: true, updated_at: 1 },
            { id: "5", archived: false, updated_at: 9 },
            { id: "6", archived: true, updated_at: 7 },
          ])
            .map((s) => s.id)
            .join(",") === "6,4"
            ? "PASS"
            : "FAIL (archived list)";

        // ---- 26. H2: the deep-diving clock lives as long as the turn does ---
        {
          const line = document.getElementById("stream-line");
          R.streamLineIdle = renderStreamLine() ?? window.__streamLineTimers();
          assert(
            `H2: an idle chat leaves the line hidden and owns no interval (hidden=${line.classList.contains("hidden")}, timers=${window.__streamLineTimers()})`,
            line.classList.contains("hidden") && window.__streamLineTimers() === 0,
          );
          const h2PrevActive = state.activeId;
          state.activeId = "h2";
          state.streams = state.streams || {};
          state.streams.h2 = { session_id: "h2", gen: 1 };
          state.turnStarted = state.turnStarted || {};
          state.turnStarted.h2 = Date.now() - 78000;
          renderStreamLine();
          assert(
            `H2: a streaming turn draws the clock with that turn's own elapsed time (text="${line.textContent}", timers=${window.__streamLineTimers()})`,
            !line.classList.contains("hidden") &&
              line.textContent === "Deep diving for 1m 18s ···" &&
              window.__streamLineTimers() === 1,
          );
          renderStreamLine();
          renderStreamLine();
          assert(
            `H2: repainting while streaming keeps exactly one interval (timers=${window.__streamLineTimers()})`,
            window.__streamLineTimers() === 1,
          );
          delete state.streams.h2;
          renderStreamLine();
          assert(
            `H2: the turn's end takes the clock and its interval with it (hidden=${line.classList.contains("hidden")}, timers=${window.__streamLineTimers()})`,
            line.classList.contains("hidden") && window.__streamLineTimers() === 0,
          );
          state.activeId = h2PrevActive;
        }

        // ---- 27. W1: the floating Working badge -----------------------------
        {
          const badge = document.getElementById("working-badge");
          const stateText = document.getElementById("working-state");
          const prevActive = state.activeId;
          state.activeId = "w1";
          state.sessions = [{ id: "w1", title: "A chat whose title is long enough to clip at thirty" }];
          state.streams = state.streams || {};
          state.streams.w1 = { session_id: "w1", gen: 1 };
          renderWorkingBadge();
          R.w1BadgeVisible = !badge.classList.contains("hidden");
          assert(
            `W1: a streaming chat shows the badge with its name and "Working" (hidden=${badge.classList.contains("hidden")}, title="${document.getElementById("working-title").textContent}", state="${stateText.textContent}")`,
            !badge.classList.contains("hidden") &&
              document.getElementById("working-title").textContent.length === 30 &&
              document.getElementById("working-title").textContent.endsWith("…"),
          );
          // The copy itself is the shipped markup's (`data-i18n="working.badge"`);
          // this fixture mounts bare hosts, so the live guard reads the real word.
          assert(
            `W1: the badge's state line belongs to the shipped markup, not to this fixture (text="${stateText.textContent}")`,
            stateText.textContent === "",
          );
          // ✕ hides this stream's card and only this one: the dismissal is keyed by
          // the stream's gen, so the next turn's badge needs no flag cleared.
          document.getElementById("working-close").click();
          R.w1DismissedHidden = badge.classList.contains("hidden");
          assert(
            `W1: ✕ hides the badge for this stream only (hidden=${badge.classList.contains("hidden")}, dismissed=${JSON.stringify(window.__workingDismissed())})`,
            badge.classList.contains("hidden") &&
              window.__workingDismissed() &&
              window.__workingDismissed().gen === 1,
          );
          state.streams.w1 = { session_id: "w1", gen: 2 }; // the next turn
          renderWorkingBadge();
          assert(
            `W1: the next turn brings it back without a flag being cleared (hidden=${badge.classList.contains("hidden")}, gen=${state.streams.w1.gen})`,
            !badge.classList.contains("hidden"),
          );
          delete state.streams.w1;
          renderWorkingBadge();
          assert(
            `W1: a settled chat draws no badge (hidden=${badge.classList.contains("hidden")})`,
            badge.classList.contains("hidden"),
          );
          state.activeId = prevActive;
        }

        R.failures = Object.values(R.checks).filter((v) => v.startsWith("FAIL")).length;
        const pre = document.createElement("pre");
        pre.id = "result";
        pre.textContent = JSON.stringify(R, null, 2);
        document.body.appendChild(pre);
      })();
    </script>
  </body>
</html>
