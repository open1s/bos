[package]
name = "ferris-runtime"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Standard runtimes for the BOS extension framework"

[features]
default = ["builtin", "declarative", "process", "workflow", "mcp", "cordis"]
builtin = []
declarative = []
process = []
workflow = []
wasm = ["dep:wasmtime"]
extism = ["dep:extism"]
mcp = []
cordis = []

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
] }

[dependencies]
ferris-core = { path = "../ferris-core" }
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true
libc = "0.2"
log = "0.4"
base64 = "0.23.1"
reqwest = { workspace = true, features = ["blocking"] }
tempfile = "3"
extism = { version = "1.41.0", default-features = false, optional = true }
wasmtime = { version = "50.0.1", default-features = false, features = [
    "component-model", "cranelift", "parallel-compilation", "runtime", "std", "wat"
], optional = true }
