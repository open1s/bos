<svg xmlns="http://www.w3.org/2000/svg" width="636" height="636" viewBox="-62 -62 636 636">
<!-- macOS grid: solid artwork = 824/1024 = 80.5% of the canvas (the value every
     Dock icon renders at: tilesize 82pt -> 164px, neighbours draw 132px = 0.805).
     A full-bleed canvas draws edge-to-edge and looks oversized in the Dock. -->
<defs><linearGradient id="a" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#12E6C3"/><stop offset="52%" stop-color="#13C8D7"/><stop offset="100%" stop-color="#367DFF"/></linearGradient></defs>
<rect width="512" height="512" rx="90" fill="#0B172B"/>
<g fill="none" stroke="url(#a)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round">
