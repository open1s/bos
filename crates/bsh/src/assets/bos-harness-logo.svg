<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600" role="img" aria-labelledby="title desc">
<title id="title">BOS Harness</title>
<desc id="desc">BOS Harness logo with a geometric connected-node B symbol and agent execution infrastructure tagline.</desc>
<defs>
