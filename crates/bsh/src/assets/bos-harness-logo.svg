    <stop offset="0%" stop-color="#12E6C3"/>
    <stop offset="52%" stop-color="#13C8D7"/>
    <stop offset="100%" stop-color="#367DFF"/>
  </linearGradient>
</defs>
<rect width="1600" height="600" fill="#FFFFFF"/>
<!-- Symbol -->
<rect x="90" y="95" width="410" height="410" rx="72" fill="#0B172B"/>
<g fill="none" stroke="url(#accent)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
  <path d="M180 180 H290 C342 180 370 210 370 246 C370 281 342 306 300 306 H220"/>
  <path d="M220 306 H300 C348 306 383 336 383 378 C383 420 350 444 302 444 H180"/>
  <path d="M180 180 V444"/>
  <path d="M370 246 H415"/>
  <path d="M350 306 H415"/>
  <path d="M383 378 V444 H415"/>
</g>
<g fill="url(#accent)">
  <circle cx="415" cy="246" r="20"/>
  <circle cx="415" cy="306" r="20"/>
  <circle cx="415" cy="444" r="20"/>
</g>
<!-- Wordmark -->
<text x="555" y="290" font-family="Inter, Avenir Next, Helvetica, Arial, sans-serif" font-size="190" font-weight="800" letter-spacing="1" fill="#0B172B">BOS</text>
<text x="555" y="405" font-family="Inter, Avenir Next, Helvetica, Arial, sans-serif" font-size="92" font-weight="700" letter-spacing="15" fill="url(#accent)">HARNESS</text>
<line x1="558" y1="447" x2="1480" y2="447" stroke="#A7B6C8" stroke-width="2"/>
<text x="558" y="495" font-family="Inter, Avenir Next, Helvetica, Arial, sans-serif" font-size="30" font-weight="600" letter-spacing="7" fill="#60758D">AGENT EXECUTION INFRASTRUCTURE</text>
</svg>