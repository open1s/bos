[package]
name = "bsh"
description = "BOS Harness - native desktop shell on the BOS framework, built with GPUI Kit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[lib]
name = "bsh"
path = "src/lib.rs"

[[bin]]
name = "bsh"
path = "src/main.rs"

[dependencies]
arrow =  { version = "60.0.0"}
parquet = { version = "60.0.0", features = ["arrow"] }
# One UI dependency: gpui-kit re-exports gpui, gpui-base, gpui-component and the
# default assets, and pins the matching GPUI release.
#
# `tree-sitter-languages` is the kit's own bundle feature: it turns on every
# grammar `gpui-component` ships (astro, bash, c, cmake, cpp, csharp, css, diff,
# ejs, elixir, erb, go, graphql, html, java, javascript, jsdoc, kotlin, lua,
# make, markdown, php, proto, python, ruby, rust, scala, sql, svelte, swift,
# toml, tsx, typescript, yaml, zig - json is always on). Without it the editor
# resolves a language name to a config with NO grammar, so every file opens as
# plain text however its extension is named; the panel's file table is only half
# of "the editor supports this type", the compiled grammar is the other half.
gpui-kit = { version = "=0.7.3", features = ["tree-sitter-languages"] }

# The BOS framework, used directly (no intermediate shell crate). This crate
# consumes the ONE `SandboxSpec` seam for the shell tool and the terminal pane,
# and never depends on heel itself, so the workspace has one dependency entry.
agent = { path = "../agent" }
react = { path = "../react" }
logging = { path = "../logging" }
config = { path = "../config" }
# Extension packages can refuse a part they declare (a DSH JavaScript entry, a
# Codex MCP server). `log` is already in the workspace graph through `logging`;
# it is the shell's way to report that refusal instead of silently dropping it.
log = "0.4.29"
# Remote plugin-market index fetches run on the shell's tokio runtime; reqwest
# is the workspace's HTTP client and already in the build through `agent`.
reqwest = { workspace = true }

tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
anyhow = { workspace = true }
futures = { workspace = true }
async-channel = { workspace = true }
uuid = { workspace = true }
shellexpand = { workspace = true }
rust-i18n = "4.2.4"
dirs = "7.0.0"
portable-pty = { workspace = true }
regorus = { workspace = true }
vte = { workspace = true }
unicode-width = { workspace = true }
# The edit tool's substring search. memchr is already in the workspace graph
# through the framework's regex stack, so naming it adds no package; the
# standard library's str::matches cost about 1us a match on a 4MiB file, and an
# edit with tens of thousands of matches spent more time searching than writing.
memchr = "2"
# The glob tool's walk and matcher are ripgrep's own ignore crate - the engine
# behind rg --files - which carries both the .gitignore/.ignore walk and the
# overrides matcher that gives "rg -g" its basename/separator semantics. The
# ripgrep crate on crates.io is a binary-only package (autolib = false, target
# rg), so ignore is its reusable half. It is already locked in the workspace
# graph, so naming it adds no package.
ignore = "0.4"
# The grep tool's pattern engine and line searcher are ripgrep's own crates,
# named through the `grep` facade the rg binary is built from. Its regex
# matcher, line-oriented searcher and binary detection are the ones rg uses;
# the facade pulls its sibling crates, all small and pure Rust.
grep = "0.4"

# The Vault's cryptography. The admin key is derived with Argon2id, the file is
# sealed with XChaCha20-Poly1305, and every key and plaintext buffer is held in
# a zeroizing wrapper.
argon2 = { workspace = true }
chacha20poly1305 = { workspace = true }
zeroize = { workspace = true }
rand = { workspace = true }

[dev-dependencies]
# The same package the kit aliases as gpui, with GPUI test hooks enabled: the
# shell is booted headlessly and its controls are clicked by debug selector.
gpui = { package = "gpui-pre", version = "=0.3.9", features = ["test-support"] }
# The runner's automatic-compaction test drives a local `LlmClient` mock; the
# react trait is async-trait-transformed, so implementations need the macro.
async-trait = { workspace = true }

# A bare `bsh` binary has no bundle, so macOS would draw a generic Dock tile;
# assets::install_dock_icon hands AppKit the .icns compiled into the binary
# instead. Versions match what gpui-pre-macos already pulls in, so they unify.
# The host's own calendar offset, for the message clock. Already in the build
# through portable-pty, so this adds no crate; a date library would be a
# dependency bought for one localtime_r call.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", features = ["NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.3.2", features = ["NSData"] }

# The Browser pane's rendered engine is Obscura, an EXTERNAL binary spoken to
# over CDP: no crate is linked for it, so a default build carries no browser
# engine code and every default gate stays as fast as it was. See
# docs/bsh-browser-substrate.md for the install recipe (the release tarball is
# NOT vendored here) and for the measured CDP facts.
#
# The one dependency the shim adds is the WebSocket transport. tungstenite is
# ALREADY in this build's graph through zenoh (agent -> zenoh -> ... ->
# tokio-tungstenite -> tungstenite 0.24), so naming it directly adds no package
# to Cargo.lock and no compile unit to the default build. It is the proven
# RFC 6455 client, and the alternative - hand-rolling masking, fragmentation and
# the handshake's SHA-1/Base64 - would be more code for the same wire.
#
# The blocking flavour is the deliberate choice: the browser's state layer is
# synchronous and the tools already run it on `spawn_blocking`, so the CDP read
# loop gets one dedicated OS thread instead of a second async runtime. This is
# the same shape the terminal's own read loop has.
[dependencies.tungstenite]
version = "0.30.0"
default-features = false
features = ["handshake"]

# Decoding a captured PNG/JPEG frame into the RGBA buffer RenderImage takes.
# gpui-pre already builds against image 0.25, so this unifies onto the one copy
# in the graph rather than adding a second version.
[dependencies.image]
version = "0.25"
default-features = false
features = ["png", "jpeg"]

# RenderImage::new takes a SmallVec of frames. The container crate is already in
# the graph through gpui-pre, so naming it adds no package; the alternative is
# an array literal, which the trait does not accept for a one-frame image.
[dependencies.smallvec]
version = "1"
