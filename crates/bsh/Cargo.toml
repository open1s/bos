[package]
name = "bsh"
description = "BOS Harness - native desktop shell on the BOS framework, built with GPUI Kit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[lib]
name = "bsh"
path = "src/lib.rs"

[[bin]]
name = "bsh"
path = "src/main.rs"

[features]
# The shell tool's sandbox. This crate consumes the ONE `SandboxSpec` seam from
# `agent` for both the shell tool and the terminal pane, and never depends on
# heel itself, so the workspace has exactly one dependency entry for it.
# ON by default because the adoption is the point; `--no-default-features` is
# the supported build where the in-tree seatbelt profile is the boundary.
default = ["heel-sandbox"]
heel-sandbox = ["agent/heel-sandbox"]

[dependencies]
arrow =  { version = "60.0.0"}
parquet = { version = "60.0.0", features = ["arrow"] }
# One UI dependency: gpui-kit re-exports gpui, gpui-base, gpui-component and the
# default assets, and pins the matching GPUI release.
#
# `tree-sitter-languages` is the kit's own bundle feature: it turns on every
# grammar `gpui-component` ships (astro, bash, c, cmake, cpp, csharp, css, diff,
# ejs, elixir, erb, go, graphql, html, java, javascript, jsdoc, kotlin, lua,
# make, markdown, php, proto, python, ruby, rust, scala, sql, svelte, swift,
# toml, tsx, typescript, yaml, zig - json is always on). Without it the editor
# resolves a language name to a config with NO grammar, so every file opens as
# plain text however its extension is named; the panel's file table is only half
# of "the editor supports this type", the compiled grammar is the other half.
gpui-kit = { version = "=0.7.3", features = ["tree-sitter-languages"] }

# The BOS framework, used directly (no intermediate shell crate).
#
# `default-features = false` so this crate's own `heel-sandbox` feature decides
# whether the shell tool runs on heel or on the in-tree seatbelt profile.
agent = { path = "../agent", default-features = false }
react = { path = "../react" }
logging = { path = "../logging" }
config = { path = "../config" }
# Extension packages can refuse a part they declare (a DSH JavaScript entry, a
# Codex MCP server). `log` is already in the workspace graph through `logging`;
# it is the shell's way to report that refusal instead of silently dropping it.
log = "0.4.29"
# Remote plugin-market index fetches run on the shell's tokio runtime; reqwest
# is the workspace's HTTP client and already in the build through `agent`.
reqwest = { workspace = true }

tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
anyhow = { workspace = true }
futures = { workspace = true }
async-channel = { workspace = true }
uuid = { workspace = true }
shellexpand = { workspace = true }
rust-i18n = "4.2.4"
dirs = "7.0.0"
portable-pty = { workspace = true }
regorus = { workspace = true }
vte = { workspace = true }
unicode-width = { workspace = true }

# The Vault's cryptography. The admin key is derived with Argon2id, the file is
# sealed with XChaCha20-Poly1305, and every key and plaintext buffer is held in
# a zeroizing wrapper.
argon2 = { workspace = true }
chacha20poly1305 = { workspace = true }
zeroize = { workspace = true }
rand = { workspace = true }

[dev-dependencies]
# The same package the kit aliases as gpui, with GPUI test hooks enabled: the
# shell is booted headlessly and its controls are clicked by debug selector.
gpui = { package = "gpui-pre", version = "=0.3.9", features = ["test-support"] }
# The runner's automatic-compaction test drives a local `LlmClient` mock; the
# react trait is async-trait-transformed, so implementations need the macro.
async-trait = { workspace = true }

# A bare `bsh` binary has no bundle, so macOS would draw a generic Dock tile;
# assets::install_dock_icon hands AppKit the .icns compiled into the binary
# instead. Versions match what gpui-pre-macos already pulls in, so they unify.
# The host's own calendar offset, for the message clock. Already in the build
# through portable-pty, so this adds no crate; a date library would be a
# dependency bought for one localtime_r call.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", features = ["NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.3.2", features = ["NSData"] }
