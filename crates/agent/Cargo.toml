[package]
name = "agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "AI agent framework with LLM integration, tools, skills, and MCP"
documentation = "https://github.com/open1s/bos#readme"
homepage = "https://github.com/open1s/bos"
repository = "https://github.com/open1s/bos"

[dependencies]
bus = { path = "../bus" }
config = { path = "../config" }
logging = { path = "../logging" }
log = "0.4.29"
tokio = { workspace = true, features = ["full"] }
reqwest = { workspace = true }
ureq = "3.3"
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
zenoh = { workspace = true }
tokio-stream = { workspace = true }
react = { path = "../react" }
qserde = { path = "../qserde" }
uuid = { workspace = true }
async-stream = { workspace = true }
toml = { workspace = true }
serde_yaml = { workspace = true }
dashmap = { workspace = true }
tempfile = "3.8"
dirs = "7.0.0"
# Only the login_tty helper (src/bin/bsh-tty-exec.rs) needs it, and only on
# Unix; declared here so the bin can call setsid/TIOCSCTTY/dup2.
libc = "0.2"
# The tool-boundary policy engine. This is the workspace's regorus 0.13
# (already used by bsh's terminal gate and the resource crate); the `arc`
# default feature makes Engine Send + Sync, so one precompiled engine can sit
# behind a Mutex and be shared by the sync tool trait.
regorus = { workspace = true }
# The sandbox every confined process this crate starts runs in. Required:
# there is one implementation, with no feature flag and no in-tree fallback.
heel = { workspace = true }

[dev-dependencies]
ureq = "3.3"

[features]
internal-api = []

[[example]]
name = "basic_usage"
path = "examples/basic_usage.rs"

[[example]]
name = "with_resilience"
path = "examples/with_resilience.rs"
