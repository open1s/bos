[package]
name = "agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "AI agent framework with LLM integration, tools, skills, and MCP"
documentation = "https://github.com/open1s/bos#readme"
homepage = "https://github.com/open1s/bos"
repository = "https://github.com/open1s/bos"

[dependencies]
bus = { path = "../bus" }
config = { path = "../config" }
logging = { path = "../logging" }
log = "0.4.29"
tokio = { workspace = true, features = ["full"] }
reqwest = { workspace = true }
ureq = "3.3"
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
zenoh = { workspace = true }
tokio-stream = { workspace = true }
react = { path = "../react" }
qserde = { path = "../qserde" }
uuid = { workspace = true }
async-stream = { workspace = true }
toml = { workspace = true }
serde_yaml = { workspace = true }
dashmap = { workspace = true }
tempfile = "3.8"
dirs = "7.0.0"
# The tool-boundary policy engine. This is the workspace's regorus 0.13
# (already used by bsh's terminal gate and the resource crate); the `arc`
# default feature makes Engine Send + Sync, so one precompiled engine can sit
# behind a Mutex and be shared by the sync tool trait.
regorus = { workspace = true }
# The sandbox every confined process this crate starts runs in. Optional so the
# build works when the crate cannot be fetched: with `heel-sandbox` off the
# shell tool falls back to its own seatbelt profile and nothing else changes.
heel = { workspace = true, optional = true }

[dev-dependencies]
ureq = "3.3"

[features]
internal-api = []
# One sandbox implementation for the shell tool: heel's SBPL/Landlock/AppContainer
# backend replaces the hand-written profile, and the grant list is derived from
# the regorus policy instead of being a constant. ON by default because the
# adoption is the point; `--no-default-features` is the documented way back to
# the in-tree profile, and it is a supported build, not an error path.
default = ["heel-sandbox"]
heel-sandbox = ["dep:heel"]

[[example]]
name = "basic_usage"
path = "examples/basic_usage.rs"

[[example]]
name = "with_resilience"
path = "examples/with_resilience.rs"
