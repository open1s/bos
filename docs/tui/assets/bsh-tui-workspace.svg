    .panel{fill:#0d1726;stroke:#293b55;stroke-width:1.2}.soft{fill:#142238;stroke:#2a3e5b}
    .line{stroke:#263951;stroke-width:1}.blue{fill:#59a8ff}.green{fill:#35d6a1}.amber{fill:#ffb454}.cyan{fill:#37cce0}
  </style>
