<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">BSH TUI adaptive three-column workspace concept</title>
<desc id="desc">Dark terminal workspace with sidebar navigation, central conversation timeline and composer, and right inspector with runtime status, jobs and agents.</desc>
