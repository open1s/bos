<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">BSH Multi-Interface Runtime Architecture</title>
<desc id="desc">One standalone Runtime Host and shared application layer connect through local IPC and web transport to GUI, TUI, CLI, browser, PWA and native mobile clients. Push is advisory only.</desc>
<defs>
 <style>
 .bg{fill:#10151c}.panel{fill:#18232e;stroke:#526779;stroke-width:2}.core{fill:#153b3b;stroke:#42d6b5;stroke-width:3}.adapter{fill:#253047;stroke:#8ca8d8;stroke-width:2}.client{fill:#202b38;stroke:#9aacc0;stroke-width:2}.push{fill:#3a2d20;stroke:#e7b86a;stroke-width:2}.h{font:700 24px sans-serif;fill:#f1f5f9}.t{font:18px sans-serif;fill:#d6e0e9}.s{font:15px sans-serif;fill:#aebdca}.line{stroke:#8ca8d8;stroke-width:3;fill:none}.dash{stroke:#e7b86a;stroke-width:2.5;stroke-dasharray:9 8;fill:none}
 </style>
 <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#8ca8d8"/></marker>
</defs>
<rect class="bg" width="1440" height="900" rx="24"/>
<text class="h" x="720" y="55" text-anchor="middle" font-size="30">BSH · One Runtime, Multiple Interfaces</text>
<rect class="core" x="260" y="100" width="920" height="360" rx="22"/>
<text class="h" x="720" y="145" text-anchor="middle">Standalone Runtime Host · Single Execution Authority</text>
<rect class="panel" x="300" y="175" width="840" height="88" rx="14"/>
<text class="h" x="720" y="210" text-anchor="middle">Agent Execution · Session · Task · Tool · Approval · Recovery</text>
<text class="s" x="720" y="240" text-anchor="middle">Host owns lifecycle, side effects, policy and recovery</text>
<rect class="panel" x="300" y="285" width="840" height="78" rx="14"/>
<text class="h" x="720" y="319" text-anchor="middle">Shared Application Layer</text>
<text class="s" x="720" y="345" text-anchor="middle">Commands · Queries · Controls · Authorization · Projections</text>
<rect class="panel" x="300" y="385" width="405" height="52" rx="12"/>
<text class="t" x="502" y="418" text-anchor="middle">Durable Journal · Snapshot · Replay</text>
<rect class="panel" x="735" y="385" width="405" height="52" rx="12"/>
<text class="t" x="937" y="418" text-anchor="middle">Dispatcher · Event Bus · Subscriptions</text>
<path class="line" d="M500 460 V510 H360 V550" marker-end="url(#arrow)"/>
<path class="line" d="M940 460 V510 H1080 V550" marker-end="url(#arrow)"/>
<rect class="adapter" x="110" y="550" width="500" height="100" rx="18"/>
<text class="h" x="360" y="590" text-anchor="middle">Local IPC Adapter</text>
<text class="t" x="360" y="620" text-anchor="middle">UDS · Windows Named Pipe · Versioned Contract</text>
<rect class="adapter" x="830" y="550" width="500" height="100" rx="18"/>
<text class="h" x="1080" y="590" text-anchor="middle">Web Transport Adapter</text>
<text class="t" x="1080" y="620" text-anchor="middle">HTTPS Commands / Queries · SSE Event Stream</text>
<path class="line" d="M360 650 V690" marker-end="url(#arrow)"/>
<path class="line" d="M1080 650 V690" marker-end="url(#arrow)"/>
<rect class="client" x="55" y="690" width="610" height="105" rx="18"/>
<text class="h" x="360" y="730" text-anchor="middle">Local Clients</text>
<text class="t" x="360" y="765" text-anchor="middle">Desktop GUI · TUI · CLI</text>
<rect class="client" x="775" y="690" width="610" height="105" rx="18"/>
<text class="h" x="1080" y="730" text-anchor="middle">Network Clients</text>
<text class="t" x="1080" y="765" text-anchor="middle">Web / PWA · Native iOS · Native Android</text>
<rect class="push" x="1060" y="815" width="325" height="58" rx="14"/>
<text class="t" x="1222" y="850" text-anchor="middle">Push = wake-up hint only</text>
<path class="dash" d="M1222 815 V795" />
<text class="s" x="720" y="855" text-anchor="middle">Client disconnect / app suspension never owns or cancels Host execution</text>
</svg>