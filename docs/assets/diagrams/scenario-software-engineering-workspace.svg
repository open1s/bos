<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="t d">
<title id="t">Software engineering workspace composition blueprint</title><desc id="d">An illustrative software engineering workspace combines a coding agent, scoped repository and file tools, terminal and browser surfaces, and extensions within execution policy.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111b2d"/><stop offset="1" stop-color="#26334d"/></linearGradient><linearGradient id="a" x2="1"><stop stop-color="#2563eb"/><stop offset="1" stop-color="#0f766e"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#020617" flood-opacity=".25"/></filter></defs>
<rect width="1200" height="620" rx="26" fill="url(#bg)"/><text x="60" y="58" fill="#93c5fd" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="3">SCENARIO 02 · SOFTWARE ENGINEERING</text><text x="60" y="105" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="750">A workspace built around the codebase</text><text x="60" y="139" fill="#b4c2d6" font-family="Inter,Arial,sans-serif" font-size="17">Give the coding agent the right project context, developer surfaces and bounded tools.</text>
<rect x="60" y="190" width="310" height="250" rx="20" fill="#1b3048" stroke="#3d5d83" filter="url(#s)"/><text x="88" y="230" fill="#93c5fd" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">DEVELOPER CONTEXT</text><text x="88" y="274" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="700">Project workspace</text><g fill="#d1dced" font-family="Inter,Arial,sans-serif" font-size="16"><text x="88" y="320">Repository &amp; source files</text><text x="88" y="353">Issue / task specification</text><text x="88" y="386">Build &amp; test constraints</text></g>
<path d="M380 315 H426" stroke="#93c5fd" stroke-width="3"/><path d="M414 305 L428 315 L414 325" fill="none" stroke="#93c5fd" stroke-width="3"/>
<rect x="446" y="190" width="340" height="250" rx="20" fill="#203d4b" stroke="#3d887f" filter="url(#s)"/><text x="476" y="230" fill="#a3e635" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">AGENT + TOOLSET</text><text x="476" y="274" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="700">Engineering agent</text><g fill="#d4e7e5" font-family="Inter,Arial,sans-serif" font-size="16"><text x="476" y="320">Search &amp; batch file reads</text><text x="476" y="353">Patch &amp; structured edits</text><text x="476" y="386">Build, test &amp; diagnostics</text></g>
<path d="M796 315 H842" stroke="#a3e635" stroke-width="3"/><path d="M830 305 L844 315 L830 325" fill="none" stroke="#a3e635" stroke-width="3"/>
<rect x="862" y="190" width="278" height="250" rx="20" fill="#29354d" stroke="#687aa4" filter="url(#s)"/><text x="890" y="230" fill="#c4b5fd" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">OPERATOR SURFACES</text><text x="890" y="274" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="700">BSH desktop</text><g fill="#dddff0" font-family="Inter,Arial,sans-serif" font-size="16"><text x="890" y="320">Editor &amp; diffs</text><text x="890" y="353">Terminal &amp; browser</text><text x="890" y="386">Extensions &amp; settings</text></g>
<rect x="60" y="475" width="1080" height="82" rx="18" fill="#172a40" stroke="#3a5878"/><text x="600" y="507" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700">Context-aware development with policy-aware execution</text><text x="600" y="534" text-anchor="middle" fill="#afc0d5" font-family="Inter,Arial,sans-serif" font-size="14">Dedicated file tools, terminal policy and extension grants complement — not replace — developer review.</text>
<text x="1140" y="590" text-anchor="end" fill="#829caf" font-family="Inter,Arial,sans-serif" font-size="12">ILLUSTRATIVE COMPOSITION BLUEPRINT · NOT A SHIPPED PRESET</text></svg>