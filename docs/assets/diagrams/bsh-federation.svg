<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">BSH Federation: Autonomous Nodes, Shared Work</title>
<desc id="desc">Three independent BSH nodes discover one another, advertise selected capabilities, delegate bounded tasks and exchange results through authenticated and authorized federation links. Each node retains its own security boundary. An optional coordinator supports discovery but does not execute remote work.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#F9FBFF"/><stop offset="1" stop-color="#EEF4FC"/></linearGradient>
 <linearGradient id="navy" x2="0" y2="1"><stop stop-color="#17345F"/><stop offset="1" stop-color="#102747"/></linearGradient>
 <linearGradient id="blue" x2="0" y2="1"><stop stop-color="#EAF3FF"/><stop offset="1" stop-color="#DCEBFF"/></linearGradient>
 <linearGradient id="green" x2="0" y2="1"><stop stop-color="#E6FAF3"/><stop offset="1" stop-color="#D7F2E8"/></linearGradient>
 <linearGradient id="violet" x2="0" y2="1"><stop stop-color="#F2EEFF"/><stop offset="1" stop-color="#E6DFFF"/></linearGradient>
 <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#17345F" flood-opacity=".09"/></filter>
 <style>
 .h{font:700 40px Inter,Arial,sans-serif;fill:#142B4D}.sub{font:18px Inter,Arial,sans-serif;fill:#63758E}.nt{font:700 21px Inter,Arial,sans-serif;fill:#FFF}.ns{font:14px Inter,Arial,sans-serif;fill:#D7E5F5}.ct{font:700 17px Inter,Arial,sans-serif;fill:#1B385D}.body{font:15px Inter,Arial,sans-serif;fill:#60738C}.tiny{font:13px Inter,Arial,sans-serif;fill:#70829A}.label{font:700 13px Inter,Arial,sans-serif;fill:#466487;letter-spacing:1px}
 </style>
</defs>
<rect width="1600" height="1000" fill="url(#bg)"/>
<text x="70" y="78" class="h">Federation: Autonomous Nodes, Shared Work</text>
<text x="72" y="112" class="sub">A network of cooperating peers — not one merged runtime or a centrally trusted super-agent.</text>

<!-- node left -->
<g filter="url(#shadow)">
 <rect x="70" y="205" width="420" height="560" rx="24" fill="#FFF" stroke="#C8D9EC" stroke-width="2"/>
 <rect x="70" y="205" width="420" height="78" rx="24" fill="url(#navy)"/><rect x="70" y="255" width="420" height="28" fill="url(#navy)"/>
</g>
<text x="105" y="253" class="nt">BSH NODE A · REQUESTER</text>
<rect x="105" y="316" width="350" height="100" rx="15" fill="url(#blue)" stroke="#C9DDF7"/>
<text x="280" y="352" text-anchor="middle" class="ct">Local Agent</text><text x="280" y="380" text-anchor="middle" class="body">Research and planning task</text>
<rect x="105" y="438" width="350" height="104" rx="15" fill="#F7F9FC" stroke="#DCE5EF"/>
<text x="280" y="474" text-anchor="middle" class="ct">Federation Client</text><text x="280" y="502" text-anchor="middle" class="body">Discover · Request · Delegate</text>
<rect x="105" y="564" width="350" height="74" rx="14" fill="#FFF7E8" stroke="#F0D9A9"/>
<text x="280" y="594" text-anchor="middle" class="ct">Caller-side Authorization</text><text x="280" y="618" text-anchor="middle" class="tiny">Local policy and explicit grants</text>
<rect x="105" y="660" width="350" height="72" rx="14" fill="#EAF0F8"/>
<text x="280" y="690" text-anchor="middle" class="ct">Private Boundary</text><text x="280" y="714" text-anchor="middle" class="tiny">Runtime · Files · Secrets · Audit</text>

<!-- node right -->
<g filter="url(#shadow)">
 <rect x="1110" y="205" width="420" height="560" rx="24" fill="#FFF" stroke="#C8D9EC" stroke-width="2"/>
 <rect x="1110" y="205" width="420" height="78" rx="24" fill="url(#navy)"/><rect x="1110" y="255" width="420" height="28" fill="url(#navy)"/>
</g>
<text x="1145" y="253" class="nt">BSH NODE B · PROVIDER</text>
<rect x="1145" y="316" width="350" height="100" rx="15" fill="url(#green)" stroke="#BDE8D8"/>
<text x="1320" y="352" text-anchor="middle" class="ct">Specialist Agent</text><text x="1320" y="380" text-anchor="middle" class="body">Domain analysis capability</text>
<rect x="1145" y="438" width="350" height="104" rx="15" fill="#F7F9FC" stroke="#DCE5EF"/>
<text x="1320" y="474" text-anchor="middle" class="ct">Capability Provider</text><text x="1320" y="502" text-anchor="middle" class="body">Advertise · Validate · Execute</text>
<rect x="1145" y="564" width="350" height="74" rx="14" fill="#FFF7E8" stroke="#F0D9A9"/>
<text x="1320" y="594" text-anchor="middle" class="ct">Provider-side Authorization</text><text x="1320" y="618" text-anchor="middle" class="tiny">Provider policy can deny or revoke</text>
<rect x="1145" y="660" width="350" height="72" rx="14" fill="#EAF0F8"/>
<text x="1320" y="690" text-anchor="middle" class="ct">Private Boundary</text><text x="1320" y="714" text-anchor="middle" class="tiny">Runtime · Files · Secrets · Audit</text>

<!-- coordinator -->
<g filter="url(#shadow)">
 <rect x="625" y="205" width="350" height="170" rx="22" fill="url(#violet)" stroke="#D5CCF4" stroke-width="2"/>
</g>
<text x="800" y="250" text-anchor="middle" class="ct" font-size="21">Optional Coordinator</text>
<text x="800" y="284" text-anchor="middle" class="body">Rendezvous · Discovery · Scheduling hints</text>
<text x="800" y="316" text-anchor="middle" class="tiny">No authority to execute peer capabilities</text>
<text x="800" y="346" text-anchor="middle" class="tiny">No implicit trust or permission escalation</text>

<!-- peer links -->
<g fill="none" stroke="#6286B4" stroke-width="4" stroke-linecap="round">
 <path d="M490 480 H1110"/>
</g>
<path d="M1088 468 L1110 480 L1088 492" fill="none" stroke="#6286B4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M512 468 L490 480 L512 492" fill="none" stroke="#6286B4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="605" y="430" width="390" height="100" rx="16" fill="#FFF" stroke="#BFD0E5" stroke-width="1.5"/>
<text x="800" y="463" text-anchor="middle" class="ct">Authenticated Peer Channel</text>
<text x="800" y="490" text-anchor="middle" class="body">Capability request · Bounded task · Result</text>
<text x="800" y="512" text-anchor="middle" class="tiny">Transport-agnostic protocol</text>

<!-- coordinator dotted links -->
<g fill="none" stroke="#9A88D2" stroke-width="2.5" stroke-dasharray="7 7">
 <path d="M490 260 C545 190 570 180 625 260"/><path d="M975 260 C1030 180 1055 190 1110 260"/>
</g>
<text x="800" y="405" text-anchor="middle" class="label">PEER-TO-PEER FIRST · COORDINATION IS OPTIONAL</text>

<!-- trust boundary callout -->
<rect x="70" y="810" width="1460" height="112" rx="20" fill="url(#navy)"/>
<text x="112" y="854" fill="#FFF" font-size="21" font-weight="700">Two-sided authorization. One bounded delegation. Two independent audit trails.</text>
<text x="112" y="888" class="ns">The caller decides what it may request; the provider decides what it will execute. Revocation, timeout and peer loss are first-class outcomes.</text>
<text x="800" y="964" text-anchor="middle" class="tiny">Discovery is not trust · Connectivity is not authorization · Remote execution stays on the provider node</text>
</svg>