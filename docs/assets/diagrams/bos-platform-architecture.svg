<text x="567" y="328" text-anchor="middle" class="h" font-size="27">BOS Agent Engine</text>
<text x="567" y="354" text-anchor="middle" class="sub">Intelligent orchestration and execution</text>
<g filter="url(#shadow)">
 <rect x="72" y="376" width="188" height="140" rx="15" class="card"/><rect x="270" y="376" width="188" height="140" rx="15" class="card"/>
 <rect x="468" y="376" width="188" height="140" rx="15" class="card"/><rect x="666" y="376" width="188" height="140" rx="15" class="card"/>
 <rect x="864" y="376" width="198" height="140" rx="15" class="card"/>
</g>
<g text-anchor="middle">
 <text x="166" y="425" font-size="29" fill="#3688E8">✦</text><text x="166" y="456" class="t">Intelligence</text><text x="166" y="481" class="muted">Planning &amp; reasoning</text>
 <text x="364" y="425" font-size="29" fill="#2676E8">⌘</text><text x="364" y="456" class="t">Tool Use</text><text x="364" y="481" class="muted">Tools &amp; plugins</text>
 <text x="562" y="425" font-size="29" fill="#8B5CE6">▤</text><text x="562" y="456" class="t">Memory</text><text x="562" y="481" class="muted">Context &amp; knowledge</text>
 <text x="760" y="425" font-size="29" fill="#E77B42">◈</text><text x="760" y="456" class="t">Communication</text><text x="760" y="481" class="muted">Multi-agent collaboration</text>
 <text x="963" y="425" font-size="29" fill="#19A86B">✓</text><text x="963" y="456" class="t">Governance</text><text x="963" y="481" class="muted">Security &amp; observability</text>
</g>

