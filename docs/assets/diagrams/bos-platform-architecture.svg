<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
<title id="title">BOS Platform Architecture</title><desc id="desc">Static architecture overview showing developer interfaces, the BOS Agent Engine and its capabilities, shared runtime foundation, and open ecosystem.</desc>
<defs>
 <linearGradient id="blue" x2="0" y2="1"><stop stop-color="#EAF4FF"/><stop offset="1" stop-color="#DCEBFF"/></linearGradient>
 <linearGradient id="green" x2="0" y2="1"><stop stop-color="#EAF9F2"/><stop offset="1" stop-color="#DDF5E9"/></linearGradient>
 <linearGradient id="purple" x2="0" y2="1"><stop stop-color="#F3F0FF"/><stop offset="1" stop-color="#EAE6FF"/></linearGradient>
 <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#203B62" flood-opacity=".08"/></filter>
 <style>
 .h{font:700 34px Arial,sans-serif;fill:#10264B}.sub{font:18px Arial,sans-serif;fill:#536987}.panel{stroke:#D7E3F2;stroke-width:1.5;fill:#FFF}.card{stroke:#D8E5F3;stroke-width:1.3;fill:#FFF}.t{font:700 19px Arial,sans-serif;fill:#132B50}.s{font:15px Arial,sans-serif;fill:#5B6F8A}.mini{font:700 16px Arial,sans-serif;fill:#16345E}.muted{font:14px Arial,sans-serif;fill:#60738C}
 </style>
</defs>
<rect width="1440" height="820" fill="#FFF"/>
<rect x="20" y="18" width="1400" height="784" rx="26" class="panel" fill="#FBFDFF"/>
<text x="58" y="72" class="h" font-size="38">BOS Platform Architecture</text>
<text x="60" y="104" class="sub">A powerful, extensible AI Agent platform</text>

<!-- Developer interfaces -->
<g filter="url(#shadow)">
 <rect x="52" y="130" width="1030" height="138" rx="18" fill="#F7FAFF" stroke="#D9E6F8"/>
 <text x="76" y="160" class="mini">Developer Interfaces</text>
 <rect x="72" y="176" width="235" height="72" rx="13" class="card"/><rect x="320" y="176" width="235" height="72" rx="13" class="card"/>
 <rect x="568" y="176" width="235" height="72" rx="13" class="card"/><rect x="816" y="176" width="246" height="72" rx="13" class="card"/>
</g>
