<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="t d">
<title id="t">Distributed multi-agent workspace target scenario</title><desc id="d">A requester BSH node coordinates bounded work with specialist agents on independent provider nodes. Each node keeps its own runtime and policy and applies provider-side authorization.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111a2d"/><stop offset="1" stop-color="#242b49"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#020617" flood-opacity=".25"/></filter></defs>
<rect width="1200" height="660" rx="26" fill="url(#bg)"/><text x="60" y="58" fill="#c4b5fd" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="3">SCENARIO 03 · DISTRIBUTED COLLABORATION</text><text x="60" y="105" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="750">A team of agents across autonomous nodes</text><text x="60" y="139" fill="#b9bed5" font-family="Inter,Arial,sans-serif" font-size="17">Delegate bounded tasks to remote specialists — without sharing a global runtime or trust domain.</text>
<rect x="60" y="190" width="300" height="330" rx="20" fill="#1d304a" stroke="#52648f" filter="url(#s)"/><text x="88" y="230" fill="#93c5fd" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">REQUESTER NODE</text><text x="88" y="274" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="700">Coordinator agent</text><g fill="#d7dcef" font-family="Inter,Arial,sans-serif" font-size="16"><text x="88" y="320">Break down the task</text><text x="88" y="353">Select trusted peers</text><text x="88" y="386">Authorize local delegation</text><text x="88" y="419">Combine returned results</text></g>
<rect x="450" y="190" width="300" height="145" rx="18" fill="#20384a" stroke="#43818a" filter="url(#s)"/><text x="480" y="229" fill="#67e8f9" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">PROVIDER NODE A</text><text x="480" y="268" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700">Research specialist</text><text x="480" y="302" fill="#c9e1e6" font-family="Inter,Arial,sans-serif" font-size="15">Own runtime · own policy · own audit</text>
<rect x="450" y="375" width="300" height="145" rx="18" fill="#28364c" stroke="#746da0" filter="url(#s)"/><text x="480" y="414" fill="#c4b5fd" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">PROVIDER NODE B</text><text x="480" y="453" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700">Engineering specialist</text><text x="480" y="487" fill="#d9d8eb" font-family="Inter,Arial,sans-serif" font-size="15">Own runtime · own policy · own audit</text>
<rect x="840" y="190" width="300" height="330" rx="20" fill="#213c3b" stroke="#668b6e" filter="url(#s)"/><text x="870" y="230" fill="#a3e635" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">CONTROLLED EXCHANGE</text><text x="870" y="274" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="700">Federation layer</text><g fill="#d8e9d5" font-family="Inter,Arial,sans-serif" font-size="16"><text x="870" y="320">Peer discovery &amp; trust</text><text x="870" y="353">Dual authorization</text><text x="870" y="386">Scoped task delegation</text><text x="870" y="419">Results &amp; audit trail</text></g>
