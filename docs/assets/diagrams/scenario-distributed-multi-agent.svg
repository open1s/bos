<rect x="60" y="550" width="1080" height="62" rx="16" fill="#18263d" stroke="#4b547c"/><text x="600" y="577" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700">Target architecture · Hybrid P2P · Transport-agnostic · Independent security boundaries</text><text x="600" y="597" text-anchor="middle" fill="#b4bdd4" font-family="Inter,Arial,sans-serif" font-size="13">Illustrative future composition — Federation capabilities are under staged development.</text>
