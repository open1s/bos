<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc">
<title id="title">BSH — Compose capabilities. Operate with trust.</title>
<desc id="desc">A conceptual product visual showing a purpose-built BSH workspace assembling an agent, model, tools, extensions and context, with independently governed BSH nodes connected through federation. This is not an application screenshot.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#090f19"/><stop offset=".58" stop-color="#111d2a"/><stop offset="1" stop-color="#102b32"/></linearGradient>
  <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c3f56b"/><stop offset="1" stop-color="#39d6bd"/></linearGradient>
  <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#38bdf8"/><stop offset="1" stop-color="#67e8f9"/></linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity=".38"/></filter>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#8ba6b7" opacity=".2"/></pattern>
</defs>
<rect width="1440" height="720" rx="30" fill="url(#bg)"/>
