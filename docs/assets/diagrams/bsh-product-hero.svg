<text x="76" y="157" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="58" font-weight="750">Compose capabilities.</text>
<text x="76" y="222" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="58" font-weight="750">Operate with trust.</text>
<text x="80" y="270" fill="#a8bac9" font-family="Inter,Arial,sans-serif" font-size="20">A purpose-built workspace for every agent task.</text>
<text x="80" y="300" fill="#a8bac9" font-family="Inter,Arial,sans-serif" font-size="20">Independent nodes. Explicit permissions. Composable capabilities.</text>
