<rect x="472" y="365" width="256" height="66" rx="14" fill="#2d3b3a" stroke="#718b5b"/><text x="600" y="392" text-anchor="middle" fill="#d9f99d" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700">AUTHORIZE &amp; RESPOND</text><text x="600" y="414" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="15">Result · status · audit</text>
<rect x="72" y="530" width="1056" height="70" rx="17" fill="#142638" stroke="#34536a"/><text x="600" y="559" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700">Two independent authorization gates</text><text x="600" y="583" text-anchor="middle" fill="#a8bbd0" font-family="Inter,Arial,sans-serif" font-size="15">Discovery ≠ Trust · Connectivity ≠ Authorization · Coordinator ≠ Execution Authority</text></svg>