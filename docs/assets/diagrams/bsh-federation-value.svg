<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="t d">
<title id="t">Federated BSH nodes</title><desc id="d">Independent BSH nodes discover and invoke explicitly authorized remote capabilities while retaining their own runtime, policies, secrets and audit boundaries.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101b2d"/><stop offset="1" stop-color="#1b2b46"/></linearGradient><linearGradient id="n" x2="1"><stop stop-color="#155e75"/><stop offset="1" stop-color="#0f766e"/></linearGradient></defs>
<rect width="1200" height="650" rx="28" fill="url(#bg)"/><text x="64" y="64" fill="#67e8f9" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="3">FEDERATION · TRUSTED COLLABORATION</text><text x="64" y="112" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="750">Work together. Stay autonomous.</text><text x="64" y="148" fill="#a8bbd0" font-family="Inter,Arial,sans-serif" font-size="17">Federation connects capabilities — it does not merge runtimes, data or authority.</text>
<rect x="72" y="210" width="340" height="278" rx="22" fill="#1c344a" stroke="#3b7187"/><rect x="788" y="210" width="340" height="278" rx="22" fill="#1c344a" stroke="#3b7187"/>
<g font-family="Inter,Arial,sans-serif"><text x="104" y="251" fill="#67e8f9" font-size="14" font-weight="700" letter-spacing="2">REQUESTER NODE</text><text x="104" y="294" fill="#fff" font-size="28" font-weight="700">BSH Node A</text><text x="104" y="342" fill="#d5e4f1" font-size="17">Local workspace</text><text x="104" y="375" fill="#d5e4f1" font-size="17">Caller-side policy</text><text x="104" y="408" fill="#d5e4f1" font-size="17">Local secrets &amp; audit</text><text x="820" y="251" fill="#a3e635" font-size="14" font-weight="700" letter-spacing="2">PROVIDER NODE</text><text x="820" y="294" fill="#fff" font-size="28" font-weight="700">BSH Node B</text><text x="820" y="342" fill="#d5e4f1" font-size="17">Remote capability</text><text x="820" y="375" fill="#d5e4f1" font-size="17">Provider-side policy</text><text x="820" y="408" fill="#d5e4f1" font-size="17">Local secrets &amp; audit</text></g>
