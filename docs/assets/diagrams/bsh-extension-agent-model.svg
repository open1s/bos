 <rect x="474" y="424" width="188" height="72" rx="12" class="card"/>
</g>
<g text-anchor="middle">
 <text x="166" y="367" class="t">Declarative</text><text x="166" y="390" class="s">JSON contributions</text>
 <text x="367" y="367" class="t">Process</text><text x="367" y="390" class="s">External process · JSON-RPC</text>
 <text x="568" y="367" class="t">WASM Component</text><text x="568" y="390" class="s">WIT · Wasmtime</text>
 <text x="166" y="453" class="t">Extism</text><text x="166" y="476" class="s">Extism plugins</text>
 <text x="367" y="453" class="t">MCP</text><text x="367" y="476" class="s">MCP server adapter</text>
 <text x="568" y="453" class="t">Built-in</text><text x="568" y="476" class="s">First-party Rust</text>
