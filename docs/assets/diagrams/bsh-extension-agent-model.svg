<rect x="52" y="528" width="630" height="112" rx="15" fill="url(#green)" stroke="#BDEBD4"/>
<text x="367" y="562" text-anchor="middle" class="t">BSH Host Services</text>
<text x="367" y="590" text-anchor="middle" class="s">Agent · GPUI · Event Bus · Storage · Commands · Panels</text>
<text x="367" y="614" text-anchor="middle" class="s">Capability authorization is distinct from OS-level isolation</text>

