<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="700" viewBox="0 0 1440 700" role="img" aria-labelledby="title desc">
<title id="title">BSH Extension Framework and Agent Execution Model</title>
<desc id="desc">Two architecture views: six supported extension package and runtime types integrated through the BSH host, alongside the BOS agent execution environment and its shared governance controls.</desc>
<defs>
 <linearGradient id="blue" x2="0" y2="1"><stop stop-color="#EAF4FF"/><stop offset="1" stop-color="#DCEBFF"/></linearGradient>
 <linearGradient id="green" x2="0" y2="1"><stop stop-color="#EAF9F2"/><stop offset="1" stop-color="#DDF5E9"/></linearGradient>
 <style>
 .h{font:700 29px Arial,sans-serif;fill:#10264B}.sub{font:17px Arial,sans-serif;fill:#536987}
 .t{font:700 17px Arial,sans-serif;fill:#132B50}.s{font:14px Arial,sans-serif;fill:#5B6F8A}
 .panel{fill:#FFF;stroke:#D7E3F2;stroke-width:1.5}.card{fill:#FFF;stroke:#D8E5F3;stroke-width:1.3}
 </style>
</defs>
<rect width="1440" height="700" fill="#FFF"/>
<!-- Extension architecture -->
<rect x="22" y="20" width="690" height="660" rx="24" class="panel"/>
<text x="58" y="66" class="h">BSH Extension Framework</text>
<text x="58" y="94" class="sub">One host contract · Multiple extension technologies</text>
<rect x="52" y="118" width="630" height="72" rx="15" fill="url(#blue)" stroke="#C7DEFA"/>
<text x="367" y="148" text-anchor="middle" class="t">Extension Package &amp; Host API</text>
<text x="367" y="174" text-anchor="middle" class="s">Manifest · Contributions · Lifecycle · Capability requests</text>
<rect x="52" y="204" width="630" height="72" rx="15" fill="#F2F5F9" stroke="#E0E6EF"/>
<text x="367" y="234" text-anchor="middle" class="t">Runtime Abstraction Layer</text>
<text x="367" y="260" text-anchor="middle" class="s">Package validation · Dependency resolution · Invocation · Diagnostics</text>
<rect x="52" y="290" width="630" height="224" rx="16" fill="#F7FAFE" stroke="#D9E5F3"/>
<text x="367" y="320" text-anchor="middle" class="t">Extension Types &amp; Runtimes</text>
<g>
 <rect x="72" y="338" width="188" height="72" rx="12" class="card"/>
 <rect x="273" y="338" width="188" height="72" rx="12" class="card"/>
