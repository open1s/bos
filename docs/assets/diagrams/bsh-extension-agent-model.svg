<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="620" viewBox="0 0 1440 620" role="img" aria-labelledby="title desc">
<title id="title">BSH Extension Framework and Agent Execution Model</title><desc id="desc">Two static architecture views: the BSH extension framework and the surrounding agent execution environment.</desc>
<defs>
 <linearGradient id="blue" x2="0" y2="1"><stop stop-color="#EAF4FF"/><stop offset="1" stop-color="#DCEBFF"/></linearGradient>
 <linearGradient id="green" x2="0" y2="1"><stop stop-color="#EAF9F2"/><stop offset="1" stop-color="#DDF5E9"/></linearGradient>
 <style>.h{font:700 29px Arial,sans-serif;fill:#10264B}.sub{font:17px Arial,sans-serif;fill:#536987}.t{font:700 18px Arial,sans-serif;fill:#132B50}.s{font:14px Arial,sans-serif;fill:#5B6F8A}.panel{fill:#FFF;stroke:#D7E3F2;stroke-width:1.5}.card{fill:#FFF;stroke:#D8E5F3;stroke-width:1.3}</style>
</defs>
<rect width="1440" height="620" fill="#FFF"/>
<!-- Left panel: extension architecture -->
<rect x="22" y="20" width="690" height="580" rx="24" class="panel"/>
<text x="58" y="66" class="h">BSH Extension Framework</text><text x="58" y="94" class="sub">Flexible extensions, powerful capabilities</text>
<rect x="52" y="120" width="630" height="76" rx="15" fill="url(#blue)" stroke="#C7DEFA"/>
<text x="367" y="151" text-anchor="middle" class="t">BSH Extension API</text><text x="367" y="177" text-anchor="middle" class="s">Manifest · Lifecycle · Capability · Contribution</text>
<rect x="52" y="210" width="630" height="76" rx="15" fill="#F2F5F9" stroke="#E0E6EF"/>
<text x="367" y="241" text-anchor="middle" class="t">Runtime Abstraction Layer</text><text x="367" y="267" text-anchor="middle" class="s">Unified lifecycle · Invocation · Isolation · Diagnostics</text>
<rect x="52" y="300" width="630" height="166" rx="16" fill="#F7FAFE" stroke="#D9E5F3"/>
<text x="367" y="329" text-anchor="middle" class="t">Extension Runtimes</text>
<g>
 <rect x="72" y="346" width="188" height="100" rx="13" class="card"/><rect x="273" y="346" width="188" height="100" rx="13" class="card"/><rect x="474" y="346" width="188" height="100" rx="13" class="card"/>
</g>
<g text-anchor="middle"><text x="166" y="384" class="t">Native</text><text x="166" y="410" class="s">Built-in Rust</text><text x="367" y="384" class="t">Extism</text><text x="367" y="410" class="s">Wasm plugins</text><text x="568" y="384" class="t">Wasmtime</text><text x="568" y="410" class="s">WIT Components</text></g>
<rect x="52" y="480" width="630" height="82" rx="15" fill="url(#green)" stroke="#BDEBD4"/>
<text x="367" y="513" text-anchor="middle" class="t">BSH Host Services</text><text x="367" y="539" text-anchor="middle" class="s">Agent · GPUI · Event Bus · Storage · Computer Use</text>

<!-- Right panel: execution model is a set of collaborating capabilities, not a flow -->
<rect x="730" y="20" width="688" height="580" rx="24" class="panel"/>
<text x="766" y="66" class="h">Agent Execution Model</text><text x="766" y="94" class="sub">A coordinated runtime with continuous oversight</text>
<rect x="764" y="130" width="190" height="120" rx="16" fill="#F7FAFF" stroke="#D8E5F3"/>
<text x="859" y="177" text-anchor="middle" class="t">User Intent</text><text x="859" y="205" text-anchor="middle" class="s">Task · Goal · Context</text>
<rect x="1000" y="124" width="150" height="150" rx="75" fill="url(#blue)" stroke="#BFD9FF" stroke-width="2"/>
<text x="1075" y="187" text-anchor="middle" class="h" font-size="22">BOS</text><text x="1075" y="214" text-anchor="middle" class="t">Agent Engine</text>
<rect x="1196" y="130" width="188" height="120" rx="16" fill="#F7FAFF" stroke="#D8E5F3"/>
<text x="1290" y="177" text-anchor="middle" class="t">Knowledge &amp; Memory</text><text x="1290" y="205" text-anchor="middle" class="s">Context · History · RAG</text>
<rect x="764" y="292" width="294" height="112" rx="16" class="card"/>
<text x="911" y="337" text-anchor="middle" class="t">Tools &amp; Integrations</text><text x="911" y="365" text-anchor="middle" class="s">MCP · Skills · Extensions · APIs</text>
<rect x="1090" y="292" width="294" height="112" rx="16" class="card"/>
<text x="1237" y="337" text-anchor="middle" class="t">Runtime Environment</text><text x="1237" y="365" text-anchor="middle" class="s">Sandbox · Isolation · GPU</text>
<rect x="764" y="430" width="620" height="112" rx="16" fill="url(#green)" stroke="#BDEBD4"/>
<text x="1074" y="474" text-anchor="middle" class="t">Safety &amp; Governance</text><text x="1074" y="502" text-anchor="middle" class="s">Permissions · Policy · Monitoring · Reliability</text>
<!-- Non-directional relationships -->
<g fill="none" stroke="#B7C8DC" stroke-width="2" stroke-linecap="round">
 <path d="M954 190 H1000 M1150 190 H1196 M1075 274 V292 M911 404 V430 M1237 404 V430"/>
</g>
</svg>