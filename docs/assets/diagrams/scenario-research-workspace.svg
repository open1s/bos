<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="t d">
<title id="t">Research workspace composition blueprint</title><desc id="d">An illustrative research workspace combines a research agent, project sources, document and analysis tools, and a structured deliverable under workspace policy.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101c2c"/><stop offset="1" stop-color="#19384a"/></linearGradient><linearGradient id="a" x2="1"><stop stop-color="#0f766e"/><stop offset="1" stop-color="#0891b2"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#020617" flood-opacity=".25"/></filter></defs>
<rect width="1200" height="620" rx="26" fill="url(#bg)"/><text x="60" y="58" fill="#67e8f9" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="3">SCENARIO 01 · RESEARCH</text><text x="60" y="105" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="750">A workspace built for deep research</text><text x="60" y="139" fill="#afc3d4" font-family="Inter,Arial,sans-serif" font-size="17">Bring sources, specialist reasoning and analysis tools into one focused environment.</text>
<rect x="60" y="190" width="260" height="250" rx="20" fill="#1b3449" stroke="#3b6075" filter="url(#s)"/><text x="88" y="230" fill="#67e8f9" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">INTENT &amp; CONTEXT</text><text x="88" y="274" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="700">Research brief</text><g fill="#c6d8e5" font-family="Inter,Arial,sans-serif" font-size="16"><text x="88" y="320">Question &amp; scope</text><text x="88" y="353">Project documents</text><text x="88" y="386">Evidence requirements</text></g>
<path d="M330 315 H378" stroke="#67e8f9" stroke-width="3"/><path d="M366 305 L380 315 L366 325" fill="none" stroke="#67e8f9" stroke-width="3"/>
<rect x="398" y="190" width="330" height="250" rx="20" fill="#203c4e" stroke="#42818a" filter="url(#s)"/><text x="428" y="230" fill="#a3e635" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">COMPOSED CAPABILITIES</text><text x="428" y="274" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="700">Research agent</text><g fill="#d4e7e5" font-family="Inter,Arial,sans-serif" font-size="16"><text x="428" y="320">Source collection adapters</text><text x="428" y="353">Document reading &amp; extraction</text><text x="428" y="386">Analysis &amp; synthesis tools</text></g>
<path d="M738 315 H786" stroke="#a3e635" stroke-width="3"/><path d="M774 305 L788 315 L774 325" fill="none" stroke="#a3e635" stroke-width="3"/>
<rect x="806" y="190" width="334" height="250" rx="20" fill="#26364b" stroke="#6475a0" filter="url(#s)"/><text x="836" y="230" fill="#c4b5fd" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">GOVERNED OUTPUT</text><text x="836" y="274" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="700">Evidence-led result</text><g fill="#d9d9ee" font-family="Inter,Arial,sans-serif" font-size="16"><text x="836" y="320">Source-linked findings</text><text x="836" y="353">Comparative analysis</text><text x="836" y="386">Report &amp; open questions</text></g>
<rect x="60" y="475" width="1080" height="82" rx="18" fill="#142a3c" stroke="#36556b"/><text x="600" y="507" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700">The composition is task-specific — not a fixed, all-tools agent.</text><text x="600" y="534" text-anchor="middle" fill="#9fb5c7" font-family="Inter,Arial,sans-serif" font-size="14">Sources and analysis integrations are selected through the workspace's configured tools and extensions.</text>
<text x="1140" y="590" text-anchor="end" fill="#829caf" font-family="Inter,Arial,sans-serif" font-size="12">ILLUSTRATIVE COMPOSITION BLUEPRINT · NOT A SHIPPED PRESET</text></svg>